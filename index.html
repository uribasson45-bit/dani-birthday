<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מסע יום הולדת ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      transition: all 0.6s ease;
      color: #222;
      text-align: center;
      background-size: cover;
      background-position: center;
    }

    .topbar {
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px;
      font-size: 14px;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: rgba(255,255,255,0.92);
      margin-top: 15px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover { opacity: 0.85; }

    .admin {
      display: none;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    input, textarea, select {
      width: 90%;
      padding: 8px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .shape {
      display: inline-block;
      width: 30px;
      height: 30px;
      margin: 5px;
      border-radius: 50%;
      background: pink;
    }
  </style>
</head>
<body>

<div class="topbar">
  🕒 <span id="clock"></span>
</div>

<div class="container">

  <h1 id="title"></h1>

  <div class="card" id="card">
    <p id="text"></p>
    <img id="img" style="display:none;" />
    <audio id="audio" controls style="display:none; width:100%;"></audio>
  </div>

  <div>
    <button onclick="prev()">⬅ קודם</button>
    <button onclick="next()">הבא ➡</button>
    <button onclick="toggleAdmin()">🔐 אדמין</button>
  </div>

  <div class="admin" id="adminPanel">
    <h3>עריכת דף</h3>

    <input id="titleInput" placeholder="כותרת" />
    <textarea id="textInput" placeholder="טקסט"></textarea>

    <label>צבע רקע</label>
    <input id="colorInput" placeholder="#ff9a9e" />

    <label>תמונה (קובץ מהמחשב)</label>
    <input type="file" onchange="loadImage(event)" />

    <label>סאונד MP3</label>
    <input type="file" accept="audio/*" onchange="loadAudio(event)" />

    <label>רקע (תמונה לשולחן עבודה)</label>
    <input type="file" onchange="setBg(event)" />

    <label>גופן</label>
    <select id="fontInput">
      <option value="Arial">Arial</option>
      <option value="Tahoma">Tahoma</option>
      <option value="Courier New">Courier</option>
      <option value="Georgia">Georgia</option>
    </select>

    <label>תזמון (YYYY-MM-DD HH:MM)</label>
    <input id="timeInput" placeholder="2026-05-24 18:00" />

    <button onclick="save()">💾 שמור דף</button>

    <h4>צורות</h4>
    <button onclick="addShape()">➕ צורה</button>

  </div>

</div>

<script>

let admin = false;
let index = 0;

let pages = [
  {
    title: "עמוד ראשון",
    text: "ברוכה הבאה ❤️",
    color: "#ff9a9e",
    img: "",
    audio: "",
    time: "2026-05-24 00:00",
    font: "Arial",
    bg: ""
  }
];

function updateClock(){
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleString();
}
setInterval(updateClock,1000);
updateClock();

function render(){
  const p = pages[index];

  document.body.style.background = p.bg ? `url(${p.bg})` : p.color;
  document.body.style.fontFamily = p.font || "Arial";

  document.getElementById("title").innerText = p.title;
  document.getElementById("text").innerText = p.text;

  const img = document.getElementById("img");
  if(p.img){ img.src = p.img; img.style.display="block"; }
  else img.style.display="none";

  const audio = document.getElementById("audio");
  if(p.audio){ audio.src = p.audio; audio.style.display="block"; }
  else audio.style.display="none";

  if(admin){
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("titleInput").value = p.title;
    document.getElementById("textInput").value = p.text;
    document.getElementById("colorInput").value = p.color;
    document.getElementById("fontInput").value = p.font;
    document.getElementById("timeInput").value = p.time;
  } else {
    document.getElementById("adminPanel").style.display="none";
  }
}

function toggleAdmin(){
  const pass = prompt("סיסמה:");
  if(pass === "1234"){
    admin = !admin;
    alert(admin ? "אדמין פעיל" : "יציאה מאדמין");
    render();
  } else alert("שגיאה");
}

function save(){
  pages[index] = {
    ...pages[index],
    title: document.getElementById("titleInput").value,
    text: document.getElementById("textInput").value,
    color: document.getElementById("colorInput").value,
    font: document.getElementById("fontInput").value,
    time: document.getElementById("timeInput").value
  };
  render();
}

function loadImage(e){
  const file = e.target.files[0];
  const r = new FileReader();
  r.onload = ev => pages[index].img = ev.target.result;
  r.readAsDataURL(file);
}

function loadAudio(e){
  const file = e.target.files[0];
  const r = new FileReader();
  r.onload = ev => pages[index].audio = ev.target.result;
  r.readAsDataURL(file);
}

function setBg(e){
  const file = e.target.files[0];
  const r = new FileReader();
  r.onload = ev => pages[index].bg = ev.target.result;
  r.readAsDataURL(file);
}

function addShape(){
  const div = document.createElement("div");
  div.className = "shape";
  div.style.background = "hsl(" + Math.random()*360 + ",70%,70%)";
  document.body.appendChild(div);
}

function next(){ if(index < pages.length-1) index++; render(); }
function prev(){ if(index > 0) index--; render(); }

function autoTime(){
  const now = new Date();
  const t = now.getTime();
