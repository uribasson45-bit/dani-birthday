<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בונה דפי חוויה ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:#f5f5f5;
}

/* VIEW */
#viewer{
text-align:center;
padding:20px;
}

.nav button{
padding:10px;
margin:5px;
background:black;
color:white;
border:none;
border-radius:10px;
}

/* EDITOR */
#editor{
display:none;
height:100vh;
}

#wrap{
display:flex;
height:100vh;
}

/* TOOLBAR */
#toolbox{
width:220px;
background:#111;
color:white;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

#canvas{
flex:1;
position:relative;
background:white;
overflow:hidden;
}

/* elements */
.element{
position:absolute;
cursor:grab;
user-select:none;
}

.imgEl{
max-width:200px;
}

.audioEl{
position:absolute;
width:200px;
cursor:grab;
}

.pageList{
margin-top:10px;
max-height:150px;
overflow:auto;
border-top:1px solid #333;
padding-top:10px;
}

.pageItem{
padding:6px;
border-bottom:1px solid #333;
cursor:pointer;
color:#ddd;
}

button{
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- VIEW -->
<div id="viewer">
<h1 id="vTitle"></h1>
<p id="vText"></p>

<div class="nav">
<button onclick="prev()">➡ קודם</button>
<button onclick="next()">הבא ⬅</button>
<button onclick="enterAdmin()">🔐 אדמין</button>
</div>
</div>

<!-- EDITOR -->
<div id="editor">

<div id="wrap">

<div id="toolbox">

<h3>כלים</h3>

<input type="file" onchange="uploadImage(event)">
<label>תמונה</label>

<input type="file" onchange="uploadAudio(event)">
<label>MP3</label>

<hr>

<button onclick="toggleLock()">🔒 מנעול דף</button>
<button onclick="save()">💾 שמור</button>
<button onclick="exitAdmin()">יציאה</button>

<div class="pageList" id="pageList"></div>

</div>

<div id="canvas"></div>

</div>

</div>

<script>

let admin=false;
let index=0;

let pages=JSON.parse(localStorage.getItem("pages"))||[
{
title:"ברוכה הבאה ❤️",
text:"זה דף ראשון",
locked:false,
elements:[]
}
];

function saveDB(){
localStorage.setItem("pages",JSON.stringify(pages));
}

/* ================= VIEW ================= */

function renderViewer(){

let p=pages[index];

if(!p || (!p.locked || admin)===false){
document.getElementById("vTitle").innerText="🔒 דף נעול";
document.getElementById("vText").innerText="";
return;
}

document.getElementById("vTitle").innerText=p.title;
document.getElementById("vText").innerText=p.text;
}

/* ניווט */
function next(){
let p=pages[index];

if(p.locked && !admin){
alert("דף נעול");
return;
}

if(index<pages.length-1){
index++;
loadCanvas();
renderViewer();
}
}

function prev(){
if(index>0){
index--;
loadCanvas();
renderViewer();
}
}

/* ================= ADMIN ================= */

function enterAdmin(){
let pass=prompt("סיסמה");
if(pass==="1234"){
admin=true;
document.getElementById("viewer").style.display="none";
document.getElementById("editor").style.display="flex";
loadCanvas();
renderList();
}
}

function exitAdmin(){
admin=false;
document.getElementById("viewer").style.display="block";
document.getElementById("editor").style.display="none";
renderViewer();
}

/* ================= CANVAS ================= */

function loadCanvas(){
let canvas=document.getElementById("canvas");
canvas.innerHTML="";

let p=pages[index];

p.elements.forEach(el=>{
createElement(el);
});
}

/* תמונה */
function uploadImage(e){
let r=new FileReader();
r.onload=ev=>{
let el={type:"img",x:50,y:50,src:ev.target.result};
pages[index].elements.push(el);
createElement(el);
};
r.readAsDataURL(e.target.files[0]);
}

/* MP3 + נגן draggable */
function uploadAudio(e){
let r=new FileReader();

r.onload=ev=>{
let el={
type:"audio",
x:60,
y:60,
src:ev.target.result
};

pages[index].elements.push(el);
createElement(el);
};

r.readAsDataURL(e.target.files[0]);
}

/* יצירת אלמנטים */
function createElement(el){

let div=document.createElement("div");
div.className="element";
div.style.left=el.x+"px";
div.style.top=el.y+"px";

if(el.type==="img"){
let img=document.createElement("img");
img.className="imgEl";
img.src=el.src;
div.appendChild(img);
}

if(el.type==="audio"){
let a=document.createElement("audio");
a.controls=true;
a.src=el.src;
div.className="audioEl";
div.appendChild(a);
}

let dragging=false,ox=0,oy=0;

div.onpointerdown=(e)=>{
dragging=true;
ox=e.clientX-el.x;
oy=e.clientY-el.y;
};

window.onpointermove=(e)=>{
if(!dragging) return;
el.x=e.clientX-ox;
el.y=e.clientY-oy;
div.style.left=el.x+"px";
div.style.top=el.y+"px";
};

window.onpointerup=()=>dragging=false;

document.getElementById("canvas").appendChild(div);
}

/* ================= LOCK ================= */

function toggleLock(){
pages[index].locked=!pages[index].locked;
saveDB();
renderList();
}

/* ================= SAVE ================= */

function save(){
saveDB();
alert("נשמר");
}

/* ================= PAGE LIST ================= */

function renderList(){
let list=document.getElementById("pageList");
list.innerHTML="";

pages.forEach((p,i)=>{
let d=document.createElement("div");
d.className="pageItem";
d.innerText=(i+1)+" "+p.title;

d.onclick=()=>{
index=i;
loadCanvas();
renderViewer();
};

list.appendChild(d);
});
}

/* INIT */

renderViewer();

</script>

</body>
</html>
