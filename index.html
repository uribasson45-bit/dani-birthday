<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Birthday Story</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;
  --gold-light:#E8D5A3;
  --rose:#C97B84;
  --navy:#1A1F3A;
  --navy-deep:#0D1124;
  --cream:#FAF6EF;
  --text-light:#F5F0E8;
  --text-muted:#A09070;
  --card-bg:rgba(255,255,255,0.06);
  --border:rgba(201,168,76,0.25);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
html,body{
  height:100%;
  min-height:-webkit-fill-available;
  overflow:hidden;
  background:var(--navy-deep);
  font-family:'Lato',sans-serif;
  color:var(--text-light);
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
/* ─── STARS ─── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}

/* ─── VIEWER ─── */
#app{
  position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
}
#progress-bar{display:flex;gap:6px;padding:16px 20px 8px;justify-content:center;flex-shrink:0}
.prog-dot{flex:1;max-width:60px;height:3px;border-radius:2px;background:rgba(255,255,255,0.2);transition:background .3s;cursor:pointer}
.prog-dot.active{background:var(--gold)}
.prog-dot.done{background:rgba(201,168,76,0.5)}

#pages-wrap{flex:1;position:relative;overflow:hidden}
.page{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px;
  transition:transform .5s cubic-bezier(.77,0,.18,1),opacity .4s;
  opacity:0;pointer-events:none;
  transform:translateX(100%);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.page.active{opacity:1;pointer-events:all;transform:translateX(0)}
.page.exit-left{transform:translateX(-100%);opacity:0}
.page.exit-right{transform:translateX(100%);opacity:0}

.el-text{text-align:center;max-width:560px;width:100%;margin:10px 0}
.el-text h1{font-family:'Playfair Display',serif;font-size:clamp(26px,6vw,52px);font-weight:600;line-height:1.2;color:var(--gold-light);margin-bottom:10px}
.el-text h2{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,36px);font-weight:400;font-style:italic;color:var(--rose);margin-bottom:8px}
.el-text p{font-size:clamp(14px,3vw,18px);line-height:1.8;font-weight:300;color:var(--text-light);opacity:.9}
.el-text .subtitle{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:700}

/* ─── IMAGE ELEMENT ─── */
.el-image{
  max-width:min(480px,90vw);
  border-radius:12px;overflow:hidden;margin:10px 0;
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--border);
  position:relative;
  transition:transform .2s;
}
.el-image img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .3s;
}
/* Image resize controls in viewer */
.el-image .img-resize-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px;background:rgba(13,17,36,.7);
  border-top:1px solid var(--border);
}
.img-resize-btn{
  background:var(--card-bg);border:1px solid var(--border);color:var(--gold);
  border-radius:6px;width:32px;height:32px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;touch-action:manipulation;
  flex-shrink:0;
}
.img-resize-btn:hover{background:rgba(201,168,76,.15)}
.img-size-label{font-size:11px;color:var(--text-muted);min-width:36px;text-align:center}
.el-image .img-placeholder{
  width:100%;height:220px;background:var(--card-bg);
  border:1px dashed var(--border);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:13px;gap:8px;
}
.el-image .img-placeholder svg{opacity:.4}

/* ─── AUDIO ELEMENT ─── */
.el-audio{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px 20px;max-width:400px;width:100%;margin:10px 0}
.el-audio .audio-title{font-size:13px;color:var(--gold);margin-bottom:12px;font-weight:700;letter-spacing:1px}
.el-audio .audio-controls{display:flex;align-items:center;gap:12px}
.el-audio .audio-btn{width:42px;height:42px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,background .2s;min-width:44px;min-height:44px;}
.el-audio .audio-btn:hover{background:var(--gold-light);transform:scale(1.08)}
.el-audio .audio-progress-wrap{flex:1;display:flex;flex-direction:column;gap:6px}
.el-audio .audio-track{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.15);border-radius:2px;cursor:pointer;outline:none;padding:8px 0;margin:-8px 0;}
.el-audio .audio-track::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer}
.el-audio .audio-time{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}
.el-audio .audio-restart{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;transition:color .2s,border-color .2s;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.el-audio .audio-restart:hover{color:var(--gold);border-color:var(--gold)}

/* ─── VIDEO ELEMENT ─── */
.el-video{
  max-width:min(520px,92vw);
  border-radius:12px;overflow:hidden;margin:10px 0;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px var(--border);
  background:#000;
}
.el-video video{
  width:100%;max-height:55vh;display:block;
  border-radius:12px;
  /* FIX: proper rendering on iOS Safari */
  -webkit-playsinline:true;
}
.el-video .video-title{
  font-size:12px;color:var(--gold);padding:8px 12px;
  background:rgba(13,17,36,.7);letter-spacing:1px;font-weight:700;
  border-top:1px solid var(--border);
}
.el-video .video-placeholder{
  width:100%;height:200px;background:var(--card-bg);
  border:1px dashed var(--border);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:13px;gap:10px;
}

/* Lock overlay */
.lock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,36,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10;gap:20px}
.lock-icon{width:72px;height:72px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pulse-lock 2s infinite}
@keyframes pulse-lock{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.4)}50%{box-shadow:0 0 0 14px rgba(201,168,76,0)}}
.lock-label{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold-light)}
.lock-hint{font-size:13px;color:var(--text-muted);letter-spacing:1px}

/* Nav */
#nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 20px;flex-shrink:0;}
.nav-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text-light);width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;font-size:22px;touch-action:manipulation;}
.nav-btn:hover:not(:disabled){background:rgba(201,168,76,.15);transform:scale(1.08)}
.nav-btn:disabled{opacity:.3;cursor:default}
#page-counter{font-size:13px;color:var(--text-muted);letter-spacing:1px}

#admin-trigger{position:fixed;top:calc(12px + var(--safe-top));left:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);transition:color .3s,border-color .3s;touch-action:manipulation;}
#admin-trigger:hover{color:var(--gold);border-color:var(--gold)}

/* ─── ADMIN LOGIN ─── */
#admin-login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(13,17,36,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none}
.login-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:40px 36px;max-width:360px;width:90%;text-align:center}
.login-card h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-light);margin-bottom:8px}
.login-card p{font-size:13px;color:var(--text-muted);margin-bottom:28px}
.login-card input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:14px 18px;color:#fff;font-size:18px;text-align:center;letter-spacing:8px;outline:none;margin-bottom:16px;transition:border-color .2s}
.login-card input:focus{border-color:var(--gold)}
.login-card .btn-primary{width:100%;padding:14px;background:var(--gold);color:var(--navy-deep);border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s;touch-action:manipulation}
.login-card .btn-primary:hover{background:var(--gold-light)}
.login-card .error{color:var(--rose);font-size:13px;margin-top:8px}

/* ─── ADMIN PANEL ─── */
#admin-panel{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:var(--navy-deep)}
.admin-topbar{background:rgba(26,31,58,.95);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;flex-wrap:wrap}
.admin-topbar h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);flex:1;min-width:120px}
.admin-topbar .btn-sm{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-light);transition:background .2s;touch-action:manipulation;white-space:nowrap}
.admin-topbar .btn-sm:hover{background:var(--card-bg)}
.admin-topbar .btn-sm.danger{border-color:var(--rose);color:var(--rose)}
.admin-topbar .btn-sm.primary{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
.admin-topbar .btn-sm.primary:hover{background:var(--gold-light)}
.admin-body{display:flex;flex:1;overflow:hidden}
#pages-sidebar{width:220px;background:rgba(26,31,58,.7);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-header{padding:14px 16px;font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-add{background:none;border:none;color:var(--gold);cursor:pointer;font-size:20px;line-height:1;transition:transform .2s;touch-action:manipulation}
.sidebar-add:hover{transform:scale(1.2)}
#pages-list{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.page-thumb{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s;display:flex;align-items:center;gap:8px;position:relative}
.page-thumb:hover{border-color:var(--gold);background:rgba(201,168,76,.06)}
.page-thumb.selected{border-color:var(--gold);background:rgba(201,168,76,.1)}
.page-thumb .pg-num{font-size:11px;color:var(--text-muted);min-width:20px}
.page-thumb .pg-name{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-thumb .pg-lock{font-size:14px;color:var(--text-muted)}
#editor-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#editor-toolbar{border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;background:rgba(13,17,36,.5)}
.tool-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-light);transition:background .2s,border-color .2s;display:flex;align-items:center;gap:6px;letter-spacing:.5px;touch-action:manipulation}
.tool-btn:hover{background:var(--card-bg);border-color:var(--gold);color:var(--gold)}
.tool-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.tool-btn.active-lock{border-color:var(--rose);color:var(--rose)}
#page-name-input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-light);font-size:14px;padding:4px 8px;outline:none;width:160px;transition:border-color .2s}
#page-name-input:focus{border-color:var(--gold)}
#elements-area{flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}
.el-item{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;position:relative}
.el-item-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.el-type-badge{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--gold);background:rgba(201,168,76,.1);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.el-item-actions{margin-right:auto;display:flex;gap:6px}
.el-action-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:11px;color:var(--text-muted);cursor:pointer;transition:color .2s,border-color .2s;touch-action:manipulation}
.el-action-btn:hover{color:var(--gold);border-color:var(--gold)}
.el-action-btn.del:hover{color:var(--rose);border-color:var(--rose)}
.el-row{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.el-row label{font-size:11px;color:var(--text-muted);letter-spacing:1px;font-weight:700}
.el-row input,.el-row select,.el-row textarea{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;outline:none;transition:border-color .2s;font-family:inherit}
.el-row input:focus,.el-row select:focus,.el-row textarea:focus{border-color:var(--gold)}
.el-row textarea{resize:vertical;min-height:80px;line-height:1.6}
.el-row select option{background:var(--navy)}
.upload-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;background:rgba(201,168,76,.12);border:1px dashed var(--gold);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;transition:background .2s;touch-action:manipulation;margin-bottom:6px;}
.upload-btn:hover{background:rgba(201,168,76,.22)}
.upload-btn input[type="file"]{display:none}
.upload-status{font-size:12px;color:var(--text-muted);margin-top:4px;word-break:break-all}
.upload-status.ok{color:#7EC897}
.el-row .img-preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px;object-fit:cover}

/* Image sizing controls in admin */
.img-size-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.img-size-row label{font-size:11px;color:var(--text-muted);font-weight:700}
.size-select{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:#fff;font-size:13px;outline:none;cursor:pointer}
.size-select option{background:var(--navy)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state svg{opacity:.2;margin-bottom:16px}
.empty-state p{font-size:14px}
#preview-pane{width:280px;border-right:1px solid var(--border);background:rgba(13,17,36,.7);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.preview-header{padding:12px 16px;font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;border-bottom:1px solid var(--border)}
#preview-inner{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;-webkit-overflow-scrolling:touch}
#notif{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy-deep);padding:10px 24px;border-radius:30px;font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#notif.show{opacity:1}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ─── MOBILE ─── */
@media(max-width:700px){
  #pages-sidebar{width:160px}
  #preview-pane{display:none}
  .admin-topbar h1{font-size:15px}
  .row2{grid-template-columns:1fr}
}
@media(max-width:520px){
  #pages-sidebar{display:none}
  #editor-toolbar{gap:6px;padding:8px 10px}
  .tool-btn{padding:6px 10px;font-size:11px}
  .admin-topbar{padding:10px 12px;gap:8px}
  #page-name-input{width:120px}
}
@supports(padding: max(0px)){
  #nav{padding-bottom:max(20px, calc(12px + var(--safe-bottom)))}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <div id="progress-bar"></div>
  <div id="pages-wrap"></div>
  <div id="nav">
    <button class="nav-btn" id="btn-next" title="הבא">&#8594;</button>
    <span id="page-counter">1 / 1</span>
    <button class="nav-btn" id="btn-prev" title="הקודם">&#8592;</button>
  </div>
</div>

<button id="admin-trigger" title="Admin">⚙</button>

<div id="admin-login">
  <div class="login-card">
    <h2>כניסת עורך</h2>
    <p>הכנס סיסמה כדי לערוך את הסיפור</p>
    <input type="password" id="login-pw" placeholder="••••" maxlength="20" autocomplete="current-password">
    <button class="btn-primary" id="login-btn">כניסה</button>
    <p class="error" id="login-err"></p>
  </div>
</div>

<div id="admin-panel">
  <div class="admin-topbar">
    <h1>✦ Birthday Story</h1>
    <input id="page-name-input" placeholder="שם הדף..." />
    <button class="btn-sm" id="toggle-lock-btn">🔒 נעל דף</button>
    <button class="btn-sm primary" id="save-btn">שמור</button>
    <button class="btn-sm danger" id="exit-admin-btn">יציאה</button>
  </div>
  <div class="admin-body">
    <div id="preview-pane">
      <div class="preview-header">תצוגה מקדימה</div>
      <div id="preview-inner"></div>
    </div>
    <div id="editor-main">
      <div id="editor-toolbar">
        <button class="tool-btn" id="add-heading">✦ כותרת</button>
        <button class="tool-btn" id="add-subheading">✧ כותרת משנה</button>
        <button class="tool-btn" id="add-text">¶ טקסט</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="add-image">🖼 תמונה</button>
        <button class="tool-btn" id="add-audio">🎵 אודיו</button>
        <button class="tool-btn" id="add-video">🎬 וידאו MP4</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="del-page-btn" style="color:var(--rose)">🗑 מחק דף</button>
      </div>
      <div id="elements-area">
        <div class="empty-state" id="empty-el">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
          <p>בחר דף מהרשימה ואז הוסף אלמנטים</p>
        </div>
      </div>
    </div>
    <div id="pages-sidebar">
      <div class="sidebar-header">
        <span>דפים</span>
        <button class="sidebar-add" id="add-page-btn" title="הוסף דף">+</button>
      </div>
      <div id="pages-list"></div>
    </div>
  </div>
</div>

<div id="notif">נשמר! ✓</div>

<script>
// ─── STATE ───
const ADMIN_PASSWORD = '1234';
const STORAGE_KEY = 'birthday_story_v4';
let state = {
  pages: [
    {
      id: uid(), name: 'עמוד 1', locked: false,
      elements: [
        {id: uid(), type: 'heading',    value: 'יום הולדת שמח! 🎂'},
        {id: uid(), type: 'subheading', value: 'לך, האהוב שלי'},
        {id: uid(), type: 'text',       value: 'זה הסיפור שלנו. לחץ ← כדי להמשיך...'}
      ]

// ─── VIEWER ───
function renderViewer(){
  const wrap = document.getElementById('pages-wrap');
  const pb   = document.getElementById('progress-bar');
  const counter = document.getElementById('page-counter');
  const cur = state.currentPage, total = state.pages.length;

  pb.innerHTML = '';
  state.pages.forEach((p,i) => {
    const d = document.createElement('div');
    d.className = 'prog-dot'+(i===cur?' active':i<cur?' done':'');
    d.title = p.name;
    d.onclick = () => { if(i<=cur) navigateTo(i); };
    pb.appendChild(d);
  });
  counter.textContent = `${cur+1} / ${total}`;

  wrap.innerHTML = '';
  state.pages.forEach((page,i) => {
    const el = document.createElement('div');
    el.className = 'page'+(i===cur?' active':i<cur?' exit-left':' exit-right');
    el.dataset.idx = i;
    page.elements.forEach(e => el.appendChild(buildViewElement(e)));
    if(page.locked){
      const lo = document.createElement('div');
      lo.className = 'lock-overlay';
      lo.innerHTML = `<div class="lock-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="lock-label">הדף נעול</div><div class="lock-hint">דף זה טרם נפתח</div>`;
      el.appendChild(lo);
    }
    wrap.appendChild(el);
  });

  document.getElementById('btn-prev').disabled = (cur >= total-1);
  document.getElementById('btn-next').disabled = (cur <= 0);
}

// ─── SIZE HELPERS ───
const IMG_SIZES = {
  small:  { label:'קטן',   maxW:'240px', maxH:'30vh' },
  medium: { label:'בינוני', maxW:'400px', maxH:'45vh' },
  large:  { label:'גדול',  maxW:'min(520px,92vw)', maxH:'60vh' },
  full:   { label:'מלא',   maxW:'min(620px,96vw)', maxH:'75vh' }
};

function buildViewElement(e){
  const wrap = document.createElement('div');

  if(e.type === 'heading'){
    wrap.className = 'el-text';
    wrap.innerHTML = `<h1>${escHtml(e.value)}</h1>`;
  }
  else if(e.type === 'subheading'){
    wrap.className = 'el-text';
    wrap.innerHTML = `<h2>${escHtml(e.value)}</h2>`;
  }
  else if(e.type === 'text'){
    wrap.className = 'el-text';
    wrap.innerHTML = `<p>${escHtml(e.value).replace(/\n/g,'<br>')}</p>`;
  }
  else if(e.type === 'subtitle'){
    wrap.className = 'el-text';
    wrap.innerHTML = `<div class="subtitle">${escHtml(e.value)}</div>`;
  }

  // ─── IMAGE (with live resize controls) ───
  else if(e.type === 'image'){
    wrap.className = 'el-image';
    const size = e.size || 'medium';
    const s = IMG_SIZES[size] || IMG_SIZES.medium;
    wrap.style.maxWidth  = s.maxW;
    wrap.style.maxHeight = s.maxH;

    if(e.src){
      const img = document.createElement('img');
      img.src = e.src; img.alt = e.alt || '';
      wrap.appendChild(img);
    } else {
      wrap.innerHTML = `<div class="img-placeholder"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>תמונה</span></div>`;
    }

    // Resize bar
    const bar = document.createElement('div');
    bar.className = 'img-resize-bar';
    const sizeOrder = ['small','medium','large','full'];
    const curIdx = sizeOrder.indexOf(size);

    const btnMinus = document.createElement('button');
    btnMinus.className = 'img-resize-btn'; btnMinus.textContent = '−';
    btnMinus.title = 'הקטן';
    btnMinus.disabled = curIdx === 0;
    btnMinus.onclick = () => {
      const p = state.pages[state.currentPage];
      const target = p && p.elements.find(x => x.id === e.id);
      if(target && curIdx > 0){ target.size = sizeOrder[curIdx-1]; renderViewer(); }
    };

    const lbl = document.createElement('span');
    lbl.className = 'img-size-label'; lbl.textContent = s.label;

    const btnPlus = document.createElement('button');
    btnPlus.className = 'img-resize-btn'; btnPlus.textContent = '+';
    btnPlus.title = 'הגדל';
    btnPlus.disabled = curIdx === sizeOrder.length-1;
    btnPlus.onclick = () => {
      const p = state.pages[state.currentPage];
      const target = p && p.elements.find(x => x.id === e.id);
      if(target && curIdx < sizeOrder.length-1){ target.size = sizeOrder[curIdx+1]; renderViewer(); }
    };

    bar.appendChild(btnMinus); bar.appendChild(lbl); bar.appendChild(btnPlus);
    wrap.appendChild(bar);
  }

  // ─── AUDIO ───
  else if(e.type === 'audio'){
    wrap.className = 'el-audio';
    const aid = 'audio_'+e.id;
    wrap.innerHTML = `
      <div class="audio-title">♪ ${escHtml(e.label||'מוזיקה')}</div>
      <audio id="${aid}" src="${e.src||''}" preload="metadata"></audio>
      <div class="audio-controls">
        <button class="audio-btn" data-aid="${aid}" data-action="playpause">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <div class="audio-progress-wrap">
          <input type="range" class="audio-track" data-aid="${aid}" min="0" max="100" value="0" step="0.1">
          <div class="audio-time">
            <span class="audio-cur" data-aid="${aid}">0:00</span>
            <span class="audio-dur" data-aid="${aid}">0:00</span>
          </div>
        </div>
        <button class="audio-restart" data-aid="${aid}" data-action="restart">↺</button>
      </div>`;
    setTimeout(() => initAudioElement(aid, e.autoplay), 100);
  }

  // ─── VIDEO (MP4) ───
  else if(e.type === 'video'){
    wrap.className = 'el-video';
    if(e.src){
      const vid = document.createElement('video');
      vid.src = e.src;
      vid.controls = true;
      vid.playsInline = true;           // iOS inline playback
      vid.setAttribute('playsinline','');
      vid.setAttribute('webkit-playsinline',''); // older iOS
      vid.preload = 'metadata';
      if(e.autoplay){ vid.autoplay = true; vid.muted = true; } // autoplay needs muted
      wrap.appendChild(vid);
      if(e.label){
        const titleDiv = document.createElement('div');
        titleDiv.className = 'video-title';
        titleDiv.textContent = '▶ '+e.label;
        wrap.appendChild(titleDiv);
      }
    } else {
      wrap.innerHTML = `<div class="video-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="4" width="20" height="16" rx="3"/><polygon points="10,9 10,15 15,12" fill="currentColor"/></svg><span>וידאו MP4</span></div>`;
    }
  }

  return wrap;
}

function initAudioElement(aid, autoplay){
  const audio = document.getElementById(aid); if(!audio) return;
  const playBtn  = document.querySelector(`[data-aid="${aid}"][data-action="playpause"]`);
  const track    = document.querySelector(`input.audio-track[data-aid="${aid}"]`);
  const curEl    = document.querySelector(`.audio-cur[data-aid="${aid}"]`);
  const durEl    = document.querySelector(`.audio-dur[data-aid="${aid}"]`);
  const restartBtn = document.querySelector(`[data-aid="${aid}"][data-action="restart"]`);
  const playIcon  = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><polygon points="5,3 19,12 5,21"/></svg>`;
  const pauseIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
  const fmt = s => Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0');
  audio.addEventListener('loadedmetadata', () => { if(durEl) durEl.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    if(!audio.duration) return;
    if(track) track.value = (audio.currentTime/audio.duration)*100;
    if(curEl) curEl.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('play',  () => { if(playBtn) playBtn.innerHTML = pauseIcon; });
  audio.addEventListener('pause', () => { if(playBtn) playBtn.innerHTML = playIcon; });
  audio.addEventListener('ended', () => { if(playBtn) playBtn.innerHTML = playIcon; if(track) track.value=0; if(curEl) curEl.textContent='0:00'; });
  if(playBtn) playBtn.onclick = () => { audio.paused ? audio.play().catch(()=>{}) : audio.pause(); };
  if(track) track.oninput = () => { if(audio.duration) audio.currentTime = (track.value/100)*audio.duration; };
  if(restartBtn) restartBtn.onclick = () => { audio.currentTime=0; audio.play().catch(()=>{}); };
  if(autoplay) audio.play().catch(()=>{});
}

// ─── NAVIGATION ───
function navigateTo(idx){
  if(!state.pages[idx]) return;
  if(idx > state.currentPage && state.pages[state.currentPage].locked) return;
  state.currentPage = idx; renderViewer();
}
function prevPage(){
  if(state.currentPage < state.pages.length - 1){
    navigateTo(state.currentPage + 1);
  }
}
 navigateTo(state.currentPage+1); 
function nextPage(){
  const cp = state.currentPage;
  if(state.pages[cp] && state.pages[cp].locked) return;
  navigateTo(cp-1);
}
document.getElementById('btn-prev').onclick = prevPage;
document.getElementById('btn-next').onclick = nextPage;

document.getElementById('pages-wrap').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, {passive:true});
document.getElementById('pages-wrap').addEventListener('touchend', e => {
  const dx = touchStartX - e.changedTouches[0].clientX;
  const dy = touchStartY - e.changedTouches[0].clientY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50){
    dx > 0 ? nextPage() : prevPage();
  }
}, {passive:true});

document.addEventListener('keydown', e => {
  if(adminMode) return;

});

    const elId  = inp.dataset.id;
    inp.addEventListener('input', () => {
      const target = getPage().elements.find(e => e.id===elId); if(!target) return;
      let val = inp.value;
      if(field==='autoplay') val = val==='true';
      target[field] = val;
      renderPreview();
    });
    // Also listen for change on select
    if(inp.tagName==='SELECT') inp.addEventListener('change', () => {
      const target = getPage().elements.find(e => e.id===elId); if(!target) return;
      let val = inp.value;
      if(field==='autoplay') val = val==='true';
      target[field] = val;
      renderPreview();
    });
  });

  // File upload events
  wrap.querySelectorAll('[data-upload]').forEach(fileInput => {
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0]; if(!file) return;
      const elId = fileInput.dataset.id;
      const uploadType = fileInput.dataset.upload;
      const target = getPage().elements.find(e => e.id===elId); if(!target) return;
      // Size limits: image 8MB, audio 15MB, video 80MB
      const limits = {image:8, audio:15, video:80};
      const maxMB = limits[uploadType] || 10;
      if(file.size > maxMB*1024*1024){
        notify(`הקובץ גדול מדי (מקסימום ${maxMB}MB)`); return;
      }
      notify('טוען קובץ...');
      const reader = new FileReader();
      reader.onload = ev => {
        target.src = ev.target.result;
        target.fileName = file.name;
        renderEditor();
        notify('הקובץ הועלה! ✓');
      };
      reader.onerror = () => notify('שגיאה בטעינת הקובץ');
      reader.readAsDataURL(file);
    });
  });

  // Move/delete
  wrap.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const action=btn.dataset.action, i=parseInt(btn.dataset.idx);
      const els=getPage().elements;
      if(action==='del'){ els.splice(i,1); renderEditor(); }
      else if(action==='up'){ [els[i-1],els[i]]=[els[i],els[i-1]]; renderEditor(); }
      else if(action==='down'){ [els[i],els[i+1]]=[els[i+1],els[i]]; renderEditor(); }
    };
  });

  return wrap;
}

function renderPreview(){
  const pane = document.getElementById('preview-inner');
  const p = getPage(); pane.innerHTML=''; if(!p) return;
  p.elements.forEach(e => {
    const el = buildViewElement(e);
    el.style.cssText='transform:scale(0.8);transform-origin:top center;margin-bottom:-16px';
    pane.appendChild(el);
  });
}

// ─── BOOTSTRAP ───
loadState();
renderViewer();
</script>
</body>
</html>
