<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>✦ Daniel Birthday Story ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;
  --gold-light:#E8D5A3;
  --rose:#C97B84;
  --navy:#1A1F3A;
  --navy-deep:#0D1124;
  --cream:#FAF6EF;
  --text-light:#F5F0E8;
  --text-muted:#A09070;
  --card-bg:rgba(255,255,255,0.06);
  --border:rgba(201,168,76,0.25);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html,body{
  height:100%;
  /* FIX: min-height for iOS Safari compatibility */
  min-height:-webkit-fill-available;
  min-height:100dvh;
  overflow:hidden;
  background:var(--navy-deep);
  font-family:'Lato',sans-serif;
  color:var(--text-light);
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  /* FIX: prevent double-tap zoom on mobile */
  touch-action:manipulation;
}

/* ─── STARS ─── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}

/* ─── VIEWER ─── */
#app{position:fixed;inset:0;z-index:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);}

#progress-bar{display:-webkit-flex;display:flex;gap:6px;padding:16px 20px 8px;-webkit-justify-content:center;justify-content:center;-webkit-flex-shrink:0;flex-shrink:0}
.prog-dot{-webkit-flex:1;flex:1;max-width:60px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .3s;cursor:pointer;
  /* FIX: ensure clickable on mobile */
  -webkit-tap-highlight-color:transparent;
  min-height:12px; /* larger tap target */
  display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;
}
.prog-dot::after{content:'';display:block;width:100%;height:3px;background:inherit;border-radius:2px}
.prog-dot{background:rgba(255,255,255,.2)}
.prog-dot.active::after{background:var(--gold)}
.prog-dot.done::after{background:rgba(201,168,76,.5)}
.prog-dot.is-locked::after{background:rgba(180,80,80,.35)}
.prog-dot.is-locked{cursor:not-allowed}

#pages-wrap{-webkit-flex:1;flex:1;position:relative;overflow:hidden}
.page{
  position:absolute;inset:0;top:0;left:0;right:0;bottom:0;
  display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center;
  padding:24px 60px 24px 20px;
  transition:transform .5s cubic-bezier(.77,0,.18,1),opacity .4s;
  opacity:0;
  /* FIX: use 'none' instead of relying on pointer-events alone – more compatible */
  pointer-events:none;
  -webkit-transform:translateX(100%);transform:translateX(100%);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  /* FIX: ensure pages stack correctly cross-browser */
  z-index:1;
}
.page.active{opacity:1;pointer-events:auto;-webkit-transform:translateX(0);transform:translateX(0);z-index:2}
.page.exit-left{-webkit-transform:translateX(-100%);transform:translateX(-100%);opacity:0;z-index:1}
.page.exit-right{-webkit-transform:translateX(100%);transform:translateX(100%);opacity:0;z-index:1}

/* ─── TEXT ELEMENTS ─── */
.el-text{text-align:center;max-width:560px;width:100%;margin:10px 0}
.el-text h1{font-family:'Playfair Display',serif;font-size:clamp(26px,6vw,52px);font-weight:600;line-height:1.2;color:var(--gold-light);margin-bottom:10px}
.el-text h2{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,36px);font-weight:400;font-style:italic;color:var(--rose);margin-bottom:8px}
.el-text p{font-size:clamp(14px,3vw,18px);line-height:1.8;font-weight:300;color:var(--text-light);opacity:.9}
.el-text .subtitle{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:700}

/* ─── TEXT STROKE / BORDER OPTION ─── */
/* Reusable text stroke classes: -webkit-text-stroke for modern browsers, text-shadow as universal fallback */
.text-stroke-gold{
  -webkit-text-stroke:1px var(--gold);
  /* Fallback using text-shadow for browsers that don't support text-stroke */
  text-shadow:
    -1px -1px 0 var(--gold),
     1px -1px 0 var(--gold),
    -1px  1px 0 var(--gold),
     1px  1px 0 var(--gold);
}
.text-stroke-white{
  -webkit-text-stroke:1px #fff;
  text-shadow:
    -1px -1px 0 #fff,
     1px -1px 0 #fff,
    -1px  1px 0 #fff,
     1px  1px 0 #fff;
}
.text-stroke-dark{
  -webkit-text-stroke:1px var(--navy-deep);
  paint-order:stroke fill;
  text-shadow:
    -1px -1px 0 var(--navy-deep),
     1px -1px 0 var(--navy-deep),
    -1px  1px 0 var(--navy-deep),
     1px  1px 0 var(--navy-deep);
}
/* Heading-specific stroke: apply to h1 or h2 inside .el-text */
.el-text.has-stroke h1,.el-text.has-stroke h2{
  -webkit-text-stroke:1.5px var(--gold);
  paint-order:stroke fill;
  text-shadow:
    -1px -1px 0 var(--gold),
     1px -1px 0 var(--gold),
    -1px  1px 0 var(--gold),
     1px  1px 0 var(--gold);
}

/* ─── IMAGE ELEMENT ─── */
.el-image{max-width:min(480px,90vw);border-radius:12px;overflow:hidden;margin:10px 0;
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--border);position:relative;transition:transform .2s}
.el-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.el-image .img-resize-bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;gap:8px;
  padding:8px;background:rgba(13,17,36,.7);border-top:1px solid var(--border)}
.img-resize-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--gold);
  border-radius:6px;width:32px;height:32px;font-size:16px;cursor:pointer;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  transition:background .2s;
  /* FIX: ensure touch targets are large enough */
  min-width:44px;min-height:44px;-webkit-flex-shrink:0;flex-shrink:0;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.img-resize-btn:hover{background:rgba(201,168,76,.15)}
.img-size-label{font-size:11px;color:var(--text-muted);min-width:36px;text-align:center}
.el-image .img-placeholder{width:100%;height:220px;background:var(--card-bg);
  border:1px dashed var(--border);border-radius:12px;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  color:var(--text-muted);font-size:13px;gap:8px}
.el-image .img-placeholder svg{opacity:.4}

/* ─── AUDIO ELEMENT ─── */
.el-audio{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px 20px;max-width:400px;width:100%;margin:10px 0}
.el-audio .audio-title{font-size:13px;color:var(--gold);margin-bottom:12px;font-weight:700;letter-spacing:1px}
.el-audio .audio-controls{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:12px}
.el-audio .audio-btn{width:42px;height:42px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  -webkit-flex-shrink:0;flex-shrink:0;transition:transform .15s,background .2s;
  min-width:44px;min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.el-audio .audio-btn:hover{background:var(--gold-light);transform:scale(1.08)}
.el-audio .audio-progress-wrap{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:6px}
.el-audio .audio-track{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.15);border-radius:2px;cursor:pointer;outline:none;padding:8px 0;margin:-8px 0}
.el-audio .audio-track::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer}
.el-audio .audio-time{font-size:11px;color:var(--text-muted);display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.el-audio .audio-restart{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;
  transition:color .2s,border-color .2s;min-width:44px;min-height:44px;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.el-audio .audio-restart:hover{color:var(--gold);border-color:var(--gold)}

/* ─── VIDEO / YOUTUBE ELEMENT ─── */
/* FIX #2: Responsive YouTube player */
.el-video{
  /* Wider by default: take more horizontal space */
  width:min(700px,96vw);
  max-width:96vw;
  border-radius:12px;overflow:hidden;margin:10px 0;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px var(--border);
  background:#000;
}
.el-video video{
  width:100%;
  /* FIX: larger video, responsive height */
  max-height:60vh;
  display:block;border-radius:12px;object-fit:contain;
}
/* FIX: proper 16:9 aspect ratio container that fills the width */
.el-video .yt-wrap{
  position:relative;
  width:100%;
  /* Modern aspect-ratio approach */
  aspect-ratio:16/9;
  /* Fallback for older browsers that don't support aspect-ratio */
  padding-bottom:0;
  background:#000;
  overflow:hidden;
}
/* Fallback: when aspect-ratio is not supported, use padding-bottom trick */
@supports not (aspect-ratio:16/9){
  .el-video .yt-wrap{
    height:0;
    padding-bottom:56.25%;
  }
  .el-video .yt-wrap iframe{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
  }
}
.el-video .yt-wrap iframe{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  border:none;
  /* FIX: explicit display block prevents Chrome gap */
  display:block;
}
.el-video .video-title{font-size:12px;color:var(--gold);padding:8px 12px;
  background:rgba(13,17,36,.7);letter-spacing:1px;font-weight:700;border-top:1px solid var(--border)}
.el-video .video-placeholder{width:100%;height:200px;background:var(--card-bg);
  border:1px dashed var(--border);border-radius:12px;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  color:var(--text-muted);font-size:13px;gap:10px}

/* ─── LOCK OVERLAY ─── */
.lock-overlay{position:absolute;inset:0;top:0;left:0;right:0;bottom:0;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  background:rgba(13,17,36,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  z-index:10;gap:20px}
.lock-icon{width:72px;height:72px;border:2px solid var(--gold);border-radius:50%;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  animation:pulse-lock 2s infinite}
@keyframes pulse-lock{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.4)}50%{box-shadow:0 0 0 14px rgba(201,168,76,0)}}
.lock-label{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold-light)}
.lock-hint{font-size:13px;color:var(--text-muted);letter-spacing:1px}

/* ─── NAV ─── */
#nav{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:space-between;justify-content:space-between;
  padding:12px 20px 20px;-webkit-flex-shrink:0;flex-shrink:0}
.nav-btn{
  background:var(--card-bg);border:1px solid var(--border);color:var(--text-light);
  /* FIX: slightly larger for mobile tap targets */
  width:56px;height:56px;min-width:44px;min-height:44px;
  border-radius:50%;cursor:pointer;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  transition:background .2s,transform .15s;font-size:22px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  /* FIX: explicit user-select none for iOS */
  -webkit-user-select:none;user-select:none;
}
.nav-btn:hover:not(:disabled){background:rgba(201,168,76,.15);transform:scale(1.08)}
.nav-btn:disabled{opacity:.3;cursor:default}
/* FIX: active state for mobile (no hover on touch) */
.nav-btn:active:not(:disabled){background:rgba(201,168,76,.25);transform:scale(0.96)}
#page-counter{font-size:13px;color:var(--text-muted);letter-spacing:1px}

/* ─── SIDE PROGRESS INDICATOR ─── */
#side-progress{
  position:fixed;right:10px;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);
  z-index:4;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;gap:7px;
  padding:12px 7px;background:rgba(13,17,36,.6);border:1px solid var(--border);
  border-radius:20px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  pointer-events:none;
}
.sp-pip{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.18);transition:all .3s;-webkit-flex-shrink:0;flex-shrink:0;position:relative;
}
.sp-pip.sp-done{background:rgba(201,168,76,.45)}
.sp-pip.sp-active{background:var(--gold);-webkit-transform:scale(1.5);transform:scale(1.5);box-shadow:0 0 6px rgba(201,168,76,.7)}
.sp-pip.sp-locked{background:rgba(180,70,70,.4);border:1px solid rgba(200,80,80,.5)}
.sp-pip.sp-locked::after{content:'🔒';position:absolute;font-size:6px;left:50%;top:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%)}
.sp-label{font-size:9px;color:var(--text-muted);letter-spacing:.5px;margin-top:3px;writing-mode:vertical-rl}

/* ─── ADMIN TRIGGER ─── */
#admin-trigger{position:fixed;top:calc(12px + var(--safe-top));left:12px;width:36px;height:36px;
  border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  cursor:pointer;z-index:5;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  color:rgba(255,255,255,.2);transition:color .3s,border-color .3s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  /* FIX: larger tap target via padding */
  min-width:44px;min-height:44px;}
#admin-trigger:hover{color:var(--gold);border-color:var(--gold)}

/* ─── ADMIN LOGIN ─── */
#admin-login{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;z-index:100;
  display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  background:rgba(13,17,36,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.login-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:40px 36px;max-width:360px;width:90%;text-align:center}
.login-card h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-light);margin-bottom:8px}
.login-card p{font-size:13px;color:var(--text-muted);margin-bottom:28px}
.login-card input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;color:#fff;text-align:center;letter-spacing:8px;
  outline:none;margin-bottom:16px;transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
  /* prevent iOS auto-zoom: font-size must be >= 16px */
  font-size:max(16px, 18px);}
.login-card input:focus{border-color:var(--gold)}
.login-card .btn-primary{width:100%;padding:14px;background:var(--gold);color:var(--navy-deep);
  border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;}
.login-card .btn-primary:hover{background:var(--gold-light)}
.login-card .error{color:var(--rose);font-size:13px;margin-top:8px}

/* ─── ADMIN PANEL ─── */
#admin-panel{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;z-index:90;
  display:none;-webkit-flex-direction:column;flex-direction:column;background:var(--navy-deep)}
/* FIX: when shown, set to flex */
#admin-panel.visible{display:-webkit-flex;display:flex}
.admin-topbar{background:rgba(26,31,58,.95);border-bottom:1px solid var(--border);padding:12px 20px;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:space-between;justify-content:space-between;
  -webkit-flex-shrink:0;flex-shrink:0;gap:12px;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.admin-topbar h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);-webkit-flex:1;flex:1;min-width:120px}
.admin-topbar .btn-sm{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text-light);transition:background .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap;min-height:44px;}
.admin-topbar .btn-sm:hover{background:var(--card-bg)}
.admin-topbar .btn-sm.danger{border-color:var(--rose);color:var(--rose)}
.admin-topbar .btn-sm.primary{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
.admin-topbar .btn-sm.primary:hover{background:var(--gold-light)}
/* FIX: add active-lock class to toolbar too */
.admin-topbar .btn-sm.active-lock{border-color:var(--rose);color:var(--rose)}
.admin-body{display:-webkit-flex;display:flex;-webkit-flex:1;flex:1;overflow:hidden}
#pages-sidebar{width:220px;background:rgba(26,31,58,.7);border-left:1px solid var(--border);
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex-shrink:0;flex-shrink:0;overflow:hidden}
.sidebar-header{padding:14px 16px;font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700;
  border-bottom:1px solid var(--border);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.sidebar-add{background:none;border:none;color:var(--gold);cursor:pointer;font-size:20px;line-height:1;transition:transform .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:44px;min-height:44px;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;}
.sidebar-add:hover{-webkit-transform:scale(1.2);transform:scale(1.2)}
#pages-list{-webkit-flex:1;flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.page-thumb{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;position:relative;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.page-thumb:hover{border-color:var(--gold);background:rgba(201,168,76,.06)}
.page-thumb.selected{border-color:var(--gold);background:rgba(201,168,76,.1)}
.page-thumb .pg-num{font-size:11px;color:var(--text-muted);min-width:20px}
.page-thumb .pg-name{font-size:13px;-webkit-flex:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-thumb .pg-lock{font-size:14px;color:var(--text-muted)}
#editor-main{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden}
#editor-toolbar{border-bottom:1px solid var(--border);padding:10px 16px;display:-webkit-flex;display:flex;gap:8px;
  -webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-flex-shrink:0;flex-shrink:0;background:rgba(13,17,36,.5)}
.tool-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text-light);
  transition:background .2s,border-color .2s;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;
  letter-spacing:.5px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;}
.tool-btn:hover{background:var(--card-bg);border-color:var(--gold);color:var(--gold)}
.tool-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.tool-btn.active-lock{border-color:var(--rose);color:var(--rose)}
#page-name-input{background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--text-light);font-size:14px;padding:4px 8px;outline:none;width:160px;transition:border-color .2s;
  -webkit-appearance:none;appearance:none;}
#page-name-input:focus{border-color:var(--gold)}
#elements-area{-webkit-flex:1;flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}
.el-item{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;position:relative}
.el-item-header{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:10px;margin-bottom:14px}
.el-type-badge{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--gold);
  background:rgba(201,168,76,.1);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.el-item-actions{margin-right:auto;display:-webkit-flex;display:flex;gap:6px}
.el-action-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;
  font-size:11px;color:var(--text-muted);cursor:pointer;transition:color .2s,border-color .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;min-width:44px;}
.el-action-btn:hover{color:var(--gold);border-color:var(--gold)}
.el-action-btn.del:hover{color:var(--rose);border-color:var(--rose)}
.el-row{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:8px;margin-bottom:10px}
.el-row label{font-size:11px;color:var(--text-muted);letter-spacing:1px;font-weight:700}
.el-row input,.el-row select,.el-row textarea{background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;outline:none;transition:border-color .2s;font-family:inherit;
  /* FIX: prevent iOS auto-zoom on focus (needs min font-size 16px) */

.el-row input:focus,.el-row select:focus,.el-row textarea:focus{border-color:var(--gold)}
.el-row textarea{resize:vertical;min-height:80px;line-height:1.6;font-size:max(16px,13px)}

.upload-btn{display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;
  background:rgba(201,168,76,.12);border:1px dashed var(--gold);color:var(--gold);font-size:13px;
  font-weight:700;cursor:pointer;transition:background .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;margin-bottom:6px;min-height:44px;}

.upload-status{font-size:12px;color:var(--text-muted);margin-top:4px;word-break:break-all}

.el-row .img-preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px;object-fit:cover}

.size-select{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;color:#fff;font-size:13px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;}
.size-select option{background:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state svg{opacity:.2;margin-bottom:16px}
.empty-state p{font-size:14px}
#preview-pane{width:280px;border-right:1px solid var(--border);background:rgba(13,17,36,.7);
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex-shrink:0;flex-shrink:0;overflow:hidden}
.preview-header{padding:12px 16px;font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;border-bottom:1px solid var(--border)}
#preview-inner{-webkit-flex:1;flex:1;overflow-y:auto;padding:20px 14px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;gap:14px;-webkit-overflow-scrolling:touch}

  background:var(--gold);color:var(--navy-deep);padding:10px 24px;border-radius:30px;
  font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}

/* ─── PER-PAGE BACKGROUND ADMIN UI ─── */
.bg-row{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:8px;margin-bottom:14px;
  padding:12px;background:rgba(201,168,76,.04);border:1px solid var(--border);border-radius:10px}

.bg-options{display:-webkit-flex;display:flex;gap:8px;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.bg-type-btn{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text-muted);transition:all .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;}
.bg-type-btn.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}
.bg-color-input{width:40px;height:34px;padding:2px;border-radius:6px;border:1px solid var(--border);
  background:transparent;cursor:pointer}
.bg-upload-btn{display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;
  background:rgba(201,168,76,.1);border:1px dashed var(--gold);color:var(--gold);font-size:12px;
  font-weight:700;cursor:pointer;transition:background .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;}

.bg-clear{padding:6px 10px;border-radius:6px;font-size:11px;border:1px solid var(--border);
  background:transparent;color:var(--text-muted);cursor:pointer;transition:color .2s,border-color .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;}
.bg-clear:hover{color:var(--rose);border-color:var(--rose)}
.bg-preview-swatch{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);-webkit-flex-shrink:0;flex-shrink:0}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}

/* ─── MOBILE ─── */

  #pages-sidebar{width:160px}
  #preview-pane{display:none}

}

  #nav{padding-bottom:max(20px,calc(12px + var(--safe-bottom)))}
}

<body>
<div id="stars"></div>

<div id="app">
  <div id="progress-bar"></div>
  <div id="pages-wrap"></div>
  <div id="nav">
    <button class="nav-btn" id="btn-prev" title="הקודם">→</button>
    <span id="page-counter">1 / 1</span>
    <button class="nav-btn" id="btn-next" title="הבא">←</button>
  </div>
</div>

<!-- Side progress indicator -->
<div id="side-progress"></div>

<button id="admin-trigger" title="Admin">⚙</button>

<div id="admin-login">
  <div class="login-card">
    <h2>כניסת עורך</h2>
    <p>הכנס סיסמה כדי לערוך את הסיפור</p>
    <input type="password" id="login-pw" placeholder="••••" maxlength="20" autocomplete="current-password">
    <button class="btn-primary" id="login-btn">כניסה</button>
    <p class="error" id="login-err"></p>
  </div>
</div>

<!-- FIX: removed display:none from inline style; JS now controls visibility via class -->
<div id="admin-panel">
  <div class="admin-topbar">
    <h1>✦ Daniel Birthday Story ✦</h1>
    <input id="page-name-input" placeholder="שם הדף..." />
    <button class="btn-sm" id="toggle-lock-btn">🔒 נעל דף</button>
    <button class="btn-sm primary" id="save-btn">שמור</button>
    <button class="btn-sm danger" id="exit-admin-btn">יציאה</button>
  </div>
  <div class="admin-body">
    <div id="preview-pane">
      <div class="preview-header">תצוגה מקדימה</div>
      <div id="preview-inner"></div>
    </div>
    <div id="editor-main">
      <div id="editor-toolbar">
        <button class="tool-btn" id="add-heading">✦ כותרת</button>
        <button class="tool-btn" id="add-subheading">✧ כותרת משנה</button>
        <button class="tool-btn" id="add-text">¶ טקסט</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="add-image">🖼 תמונה</button>
        <button class="tool-btn" id="add-audio">🎵 אודיו</button>
        <button class="tool-btn" id="add-video">▶ וידאו / YouTube</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="del-page-btn" style="color:var(--rose)">🗑 מחק דף</button>
      </div>
      <div id="elements-area">
        <div class="empty-state" id="empty-el">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
          <p>בחר דף מהרשימה ואז הוסף אלמנטים</p>
        </div>
      </div>
    </div>
    <div id="pages-sidebar">
      <div class="sidebar-header">
        <span>דפים</span>
        <button class="sidebar-add" id="add-page-btn" title="הוסף דף">+</button>
      </div>
      <div id="pages-list"></div>
    </div>
  </div>
</div>

<div id="notif">נשמר! ✓</div>

<script>
// ─── CONSTANTS ───
var ADMIN_PASSWORD = '1234';
var STORAGE_KEY    = 'birthday_story_v5';

// ─── STATE ───
var state = {
  pages: [{
    id: uid(), name: 'עמוד 1', locked: false,
    background: { type: 'none', value: '' },
    elements: [
      { id: uid(), type: 'heading',    value: 'יום הולדת שמח! 🎂' },
      { id: uid(), type: 'subheading', value: 'לך, האהוב שלי' },
      { id: uid(), type: 'text',       value: 'זה הסיפור שלנו. לחץ → כדי להמשיך...' }
    ]
  }],
  currentPage: 0
};
var adminMode       = false;
var selectedPageIdx = 0;

// Touch tracking
var _touchStartX = 0;
var _touchStartY = 0;
var _touchStartT = 0;

// ─── UTILS ───
function uid() { return Math.random().toString(36).slice(2, 10); }

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

var _notifTimer = null;
function notify(msg) {
  var n = document.getElementById('notif');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(_notifTimer);
  _notifTimer = setTimeout(function() { n.classList.remove('show'); }, 2400);
}

// ─── YOUTUBE HELPERS ───
function getYouTubeId(url) {
  if (!url) return null;
  var patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = url.match(patterns[i]);
    if (m) return m[1];
  }
  return null;
}

function isYouTubeUrl(url) {
  return !!getYouTubeId(url);
}

// ─── PERSISTENCE ───
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      // Migrate old saves: ensure background field exists
      if (parsed && Array.isArray(parsed.pages)) {
        parsed.pages.forEach(function(p) {
          if (!p.background) p.background = { type: 'none', value: '' };
        });
      }
      state = parsed;
    }
  } catch(e) { console.warn('loadState failed', e); }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    notify('נשמר! ✓');
  } catch(e) {
    notify('שגיאה בשמירה – הקבצים גדולים מדי');
  }
}

// ─── STARS ───
(function() {
  var c = document.getElementById('stars');
  for (var i = 0; i < 80; i++) {
    var s  = document.createElement('div');
    s.className = 'star';
    var sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;--d:'+(2+Math.random()*4)+'s;--delay:'+(Math.random()*4)+'s;opacity:'+(Math.random()*.5);
    c.appendChild(s);
  }
})();

// ─── IMG SIZE MAP ───
var IMG_SIZES = {
  small:  { label: 'קטן',   maxW: '240px',              maxH: '30vh' },
  medium: { label: 'בינוני', maxW: '400px',              maxH: '45vh' },
  large:  { label: 'גדול',  maxW: 'min(520px,92vw)',    maxH: '60vh' },
  full:   { label: 'מלא',   maxW: 'min(620px,96vw)',    maxH: '75vh' }
};

// ─── SIDE PROGRESS ───
function renderSideProgress() {
  var sp  = document.getElementById('side-progress');
  var cur = state.currentPage;
  sp.innerHTML = '';
  state.pages.forEach(function(p, i) {
    var pip = document.createElement('div');
    if (i === cur)       pip.className = 'sp-pip sp-active';
    else if (i < cur)    pip.className = 'sp-pip sp-done';
    else if (p.locked)   pip.className = 'sp-pip sp-locked';
    else                 pip.className = 'sp-pip';
    pip.title = p.name + (p.locked && i > cur ? ' 🔒' : '');
    sp.appendChild(pip);
  });
  var lbl = document.createElement('div');
  lbl.className = 'sp-label';
  lbl.textContent = (cur+1) + '/' + state.pages.length;
  sp.appendChild(lbl);
}

// ─── VIEWER ───
function renderViewer() {
  var wrap    = document.getElementById('pages-wrap');
  var pb      = document.getElementById('progress-bar');
  var counter = document.getElementById('page-counter');
  var cur     = state.currentPage;
  var total   = state.pages.length;

  // Top progress dots
  pb.innerHTML = '';
  state.pages.forEach(function(p, i) {
    var d = document.createElement('div');
    var cls = 'prog-dot';
    if (i === cur)     cls += ' active';
    else if (i < cur)  cls += ' done';
    else if (p.locked) cls += ' is-locked';
    d.className = cls;
    d.title = p.name + (p.locked && i > cur ? ' 🔒' : '');
    // FIX: use addEventListener instead of onclick for better cross-browser compatibility
    (function(pageIdx, isLocked) {
      d.addEventListener('click', function() {
        if (pageIdx < cur) navigateTo(pageIdx);
        else if (pageIdx === cur) return;
        else if (!isLocked) navigateTo(pageIdx);
      });
    })(i, p.locked);
    pb.appendChild(d);
  });

  counter.textContent = (cur+1) + ' / ' + total;

  // Pages
  wrap.innerHTML = '';
  state.pages.forEach(function(page, i) {
    var el = document.createElement('div');
    el.className = 'page' + (i === cur ? ' active' : i < cur ? ' exit-left' : ' exit-right');
    el.dataset.idx = i;

    // Per-page background
    applyPageBackground(el, page.background);

    // Elements
    page.elements.forEach(function(e) { el.appendChild(buildViewElement(e)); });

    // Lock overlay (only on pages AHEAD that are locked)
    if (page.locked && i !== cur) {
      var lo = document.createElement('div');
      lo.className = 'lock-overlay';
      lo.innerHTML = '<div class="lock-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="lock-label">הדף נעול</div><div class="lock-hint">דף זה טרם נפתח</div>';
      el.appendChild(lo);
    }
    wrap.appendChild(el);
  });

  // Button states
  document.getElementById('btn-prev').disabled = (cur <= 0);
  document.getElementById('btn-next').disabled = (cur >= total - 1);

  renderSideProgress();
}

function applyPageBackground(el, bg) {
  if (!bg || bg.type === 'none') {
    el.style.background = '';
    return;
  }
  if (bg.type === 'color') {
    el.style.background = bg.value;
  } else if (bg.type === 'image') {
    el.style.background = "url('" + bg.value + "') center/cover no-repeat";
  }
}

// ─── BUILD VIEW ELEMENT ───
function buildViewElement(e) {
  var wrap = document.createElement('div');

  if (e.type === 'heading') {
    wrap.className = 'el-text';
    wrap.innerHTML = '<h1>' + escHtml(e.value) + '</h1>';
  }
  else if (e.type === 'subheading') {
    wrap.className = 'el-text';
    wrap.innerHTML = '<h2>' + escHtml(e.value) + '</h2>';
  }
  else if (e.type === 'text') {
    wrap.className = 'el-text';
    wrap.innerHTML = '<p>' + escHtml(e.value).replace(/\n/g, '<br>') + '</p>';
  }
  else if (e.type === 'subtitle') {
    wrap.className = 'el-text';
    wrap.innerHTML = '<div class="subtitle">' + escHtml(e.value) + '</div>';
  }
  // ─── IMAGE ───
  else if (e.type === 'image') {
    wrap.className = 'el-image';
    var size = e.size || 'medium';
    var s    = IMG_SIZES[size] || IMG_SIZES.medium;
    wrap.style.maxWidth  = s.maxW;
    wrap.style.maxHeight = s.maxH;

    if (e.src) {
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.src = e.src;
      img.alt = e.alt || '';
      wrap.appendChild(img);
    } else {
      wrap.innerHTML = '<div class="img-placeholder"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>תמונה</span></div>';
    }

    // Resize bar
    var bar       = document.createElement('div');
    bar.className   = 'img-resize-bar';
    var sizeOrder = ['small', 'medium', 'large', 'full'];
    var curIdx    = sizeOrder.indexOf(size);

    var btnMinus  = document.createElement('button');
    btnMinus.className = 'img-resize-btn';
    btnMinus.textContent = '−';
    btnMinus.title = 'הקטן';
    btnMinus.disabled = (curIdx === 0);
    // FIX: use addEventListener for cross-browser compatibility
    (function(eRef, idx) {
      btnMinus.addEventListener('click', function() {
        var p      = state.pages[state.currentPage];
        var target = p && p.elements.find(function(x) { return x.id === eRef.id; });
        if (target && idx > 0) { target.size = sizeOrder[idx - 1]; renderViewer(); }
      });
    })(e, curIdx);

    var lbl = document.createElement('span');
    lbl.className   = 'img-size-label';
    lbl.textContent = s.label;

    var btnPlus = document.createElement('button');
    btnPlus.className = 'img-resize-btn';
    btnPlus.textContent = '+';
    btnPlus.title = 'הגדל';
    btnPlus.disabled = (curIdx === sizeOrder.length - 1);
    (function(eRef, idx) {
      btnPlus.addEventListener('click', function() {
        var p      = state.pages[state.currentPage];
        var target = p && p.elements.find(function(x) { return x.id === eRef.id; });
        if (target && idx < sizeOrder.length - 1) { target.size = sizeOrder[idx + 1]; renderViewer(); }
      });
    })(e, curIdx);

    bar.appendChild(btnMinus);
    bar.appendChild(lbl);
    bar.appendChild(btnPlus);
    wrap.appendChild(bar);
  }
  // ─── AUDIO ───
  else if (e.type === 'audio') {
    wrap.className = 'el-audio';
    var aid = 'audio_' + e.id;
    wrap.innerHTML =
      '<div class="audio-title">♪ ' + escHtml(e.label || 'מוזיקה') + '</div>' +
      '<audio id="' + aid + '" preload="metadata"' + (e.src ? ' src="' + escHtml(e.src) + '"' : '') + '></audio>' +
      '<div class="audio-controls">' +
        '<button class="audio-btn" data-aid="' + aid + '" data-action="playpause">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><polygon points="5,3 19,12 5,21"/></svg>' +
        '</button>' +
        '<div class="audio-progress-wrap">' +
          '<input type="range" class="audio-track" data-aid="' + aid + '" min="0" max="100" value="0" step="0.1">' +
          '<div class="audio-time">' +
            '<span class="audio-cur" data-aid="' + aid + '">0:00</span>' +
            '<span class="audio-dur" data-aid="' + aid + '">0:00</span>' +
          '</div>' +
        '</div>' +
        '<button class="audio-restart" data-aid="' + aid + '" data-action="restart">↺</button>' +
      '</div>';
    setTimeout(function() { initAudioElement(aid, e.autoplay); }, 120);
  }
  // ─── VIDEO / YOUTUBE ───
  else if (e.type === 'video') {
    wrap.className = 'el-video';
    var ytId = getYouTubeId(e.src || '');

    if (ytId) {
      // FIX #2: YouTube embed — properly sized responsive container
      var ytWrap = document.createElement('div');
      ytWrap.className = 'yt-wrap';
      var params = 'rel=0&modestbranding=1' + (e.autoplay ? '&autoplay=1&mute=1' : '');
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/' + ytId + '?' + params;
      // FIX: use setAttribute for cross-browser allow attribute
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('loading', 'lazy');
      iframe.frameBorder = '0';
      ytWrap.appendChild(iframe);
      wrap.appendChild(ytWrap);
      if (e.label) {
        var td = document.createElement('div');
        td.className = 'video-title';
        td.textContent = '▶ ' + e.label;
        wrap.appendChild(td);
      }
    } else if (e.src) {
      // MP4 / direct video — full cross-browser fix
      var vid = document.createElement('video');
      vid.controls    = true;
      vid.playsInline = true;
      vid.setAttribute('playsinline', '');
      vid.setAttribute('webkit-playsinline', '');
      vid.setAttribute('x5-playsinline', '');
      vid.preload = 'metadata';
      if (e.autoplay) { vid.autoplay = true; vid.muted = true; vid.setAttribute('muted', ''); }
      vid.src = e.src;
      wrap.appendChild(vid);
      if (e.label) {
        var tdv = document.createElement('div');
        tdv.className = 'video-title';
        tdv.textContent = '▶ ' + e.label;
        wrap.appendChild(tdv);
      }
    } else {
      wrap.innerHTML = '<div class="video-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="4" width="20" height="16" rx="3"/><polygon points="10,9 10,15 15,12" fill="currentColor"/></svg><span>וידאו / YouTube</span></div>';
    }
  }

  return wrap;
}

// ─── AUDIO INIT ───
function initAudioElement(aid, autoplay) {
  var audio      = document.getElementById(aid); if (!audio) return;
  var playBtn    = document.querySelector('[data-aid="' + aid + '"][data-action="playpause"]');
  var track      = document.querySelector('input.audio-track[data-aid="' + aid + '"]');
  var curEl      = document.querySelector('.audio-cur[data-aid="' + aid + '"]');
  var durEl      = document.querySelector('.audio-dur[data-aid="' + aid + '"]');
  var restartBtn = document.querySelector('[data-aid="' + aid + '"][data-action="restart"]');
  var playIcon   = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><polygon points="5,3 19,12 5,21"/></svg>';
  var pauseIcon  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  var fmt = function(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };

  audio.addEventListener('loadedmetadata', function() { if (durEl) durEl.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function() {
    if (!audio.duration) return;
    if (track) track.value = (audio.currentTime / audio.duration) * 100;
    if (curEl) curEl.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('play',  function() { if (playBtn) playBtn.innerHTML = pauseIcon; });
  audio.addEventListener('pause', function() { if (playBtn) playBtn.innerHTML = playIcon; });
  audio.addEventListener('ended', function() {
    if (playBtn) playBtn.innerHTML = playIcon;
    if (track)   track.value = 0;
    if (curEl)   curEl.textContent = '0:00';
  });
  if (playBtn) {
    playBtn.addEventListener('click', function() {
      if (audio.paused) audio.play().catch(function() {});
      else              audio.pause();
    });
  }
  if (track) {
    track.addEventListener('input', function() {
      if (audio.duration) audio.currentTime = (track.value / 100) * audio.duration;
    });
  }
  if (restartBtn) {
    restartBtn.addEventListener('click', function() {
      audio.currentTime = 0; audio.play().catch(function() {});
    });
  }
  if (autoplay) setTimeout(function() { audio.play().catch(function() {}); }, 300);
}

// ─── NAVIGATION ───
function navigateTo(idx) {
  if (idx < 0 || idx >= state.pages.length) return;

  // Going forward: block if destination page is locked
  if (idx > state.currentPage && state.pages[idx] && state.pages[idx].locked) {
    notify('🔒 הדף נעול');
    return;
  }
  // Going backward is always allowed

  state.currentPage = idx;
  renderViewer();
}

function goNext() {
  navigateTo(state.currentPage + 1);
}

function goPrev() {
  navigateTo(state.currentPage - 1);
}

// ─── NAV BUTTONS ───
// FIX: use addEventListener instead of onclick for Chrome compatibility
document.getElementById('btn-next').addEventListener('click', goNext);
document.getElementById('btn-prev').addEventListener('click', goPrev);

// FIX: also add touchend listener for iOS Safari (prevents 300ms delay)
document.getElementById('btn-next').addEventListener('touchend', function(e) {
  e.preventDefault();
  goNext();
});
document.getElementById('btn-prev').addEventListener('touchend', function(e) {
  e.preventDefault();
  goPrev();
});

// ─── TOUCH SWIPE ───
(function() {
  var wrap = document.getElementById('pages-wrap');

  wrap.addEventListener('touchstart', function(ev) {
    if (ev.touches.length !== 1) return;
    _touchStartX = ev.touches[0].clientX;
    _touchStartY = ev.touches[0].clientY;
    _touchStartT = Date.now();
  }, { passive: true });

  wrap.addEventListener('touchend', function(ev) {
    if (ev.changedTouches.length !== 1) return;
    var dx = ev.changedTouches[0].clientX - _touchStartX;
    var dy = ev.changedTouches[0].clientY - _touchStartY;
    var dt = Date.now() - _touchStartT;
    // Must be: horizontal-dominant, ≥40px, within 500ms
    if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 40 && dt < 500) {
      if (dx < 0) goNext();  // swipe left  → next page
      else        goPrev();  // swipe right → prev page
    }
  }, { passive: true });
})();

// ─── KEYBOARD ───
document.addEventListener('keydown', function(ev) {
  if (adminMode) return;
  if (ev.key === 'ArrowRight') goPrev();
  if (ev.key === 'ArrowLeft')  goNext();
});

// ─── ADMIN LOGIN ───
document.getElementById('admin-trigger').addEventListener('click', function() {
  if (adminMode) { exitAdmin(); return; }
  var loginEl = document.getElementById('admin-login');
  // FIX: use display flex consistently
  loginEl.style.display = 'flex';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-err').textContent = '';
  setTimeout(function() { document.getElementById('login-pw').focus(); }, 100);
});

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-pw').addEventListener('keydown', function(ev) {
  if (ev.key === 'Enter') doLogin();
});

function doLogin() {
  var pw = document.getElementById('login-pw').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('admin-login').style.display = 'none';
    enterAdmin();
  } else {
    document.getElementById('login-err').textContent = 'סיסמה שגויה, נסה שוב';
    document.getElementById('login-pw').value = '';
  }
}

function enterAdmin() {
  adminMode = true;
  // FIX: use classList to toggle visibility, ensuring flex layout is applied correctly
  var panel = document.getElementById('admin-panel');
  panel.style.display = 'flex';
  selectedPageIdx = state.currentPage;
  renderAdminSidebar();
  renderEditor();
}

function exitAdmin() {
  adminMode = false;
  document.getElementById('admin-panel').style.display = 'none';
  renderViewer();
}

// FIX: use addEventListener throughout for consistent cross-browser behavior
document.getElementById('exit-admin-btn').addEventListener('click', exitAdmin);
document.getElementById('save-btn').addEventListener('click', function() {
  applyPageName(); saveState(); renderViewer();
});

// ─── ADMIN SIDEBAR ───
function renderAdminSidebar() {
  var list = document.getElementById('pages-list');
  list.innerHTML = '';
  state.pages.forEach(function(p, i) {
    var el = document.createElement('div');
    el.className = 'page-thumb' + (i === selectedPageIdx ? ' selected' : '');
    el.innerHTML = '<span class="pg-num">' + (i + 1) + '</span><span class="pg-name">' + escHtml(p.name) + '</span>' + (p.locked ? '<span class="pg-lock">🔒</span>' : '');
    // FIX: use addEventListener (onclick override issues in some Chrome versions)
    (function(idx) {
      el.addEventListener('click', function() {
        applyPageName(); selectedPageIdx = idx; renderAdminSidebar(); renderEditor();
      });
    })(i);
    list.appendChild(el);
  });
}

document.getElementById('add-page-btn').addEventListener('click', function() {
  applyPageName();
  var p = { id: uid(), name: 'עמוד ' + (state.pages.length + 1), locked: false, background: { type: 'none', value: '' }, elements: [] };
  state.pages.push(p);
  selectedPageIdx = state.pages.length - 1;
  renderAdminSidebar();
  renderEditor();
});

document.getElementById('del-page-btn').addEventListener('click', function() {
  if (state.pages.length <= 1) { notify('לא ניתן למחוק את הדף האחרון'); return; }
  if (!confirm('למחוק את הדף?')) return;
  state.pages.splice(selectedPageIdx, 1);
  selectedPageIdx = Math.max(0, selectedPageIdx - 1);
  if (state.currentPage >= state.pages.length) state.currentPage = state.pages.length - 1;
  renderAdminSidebar();
  renderEditor();
});

// ─── EDITOR ───
function getPage() { return state.pages[selectedPageIdx]; }

function applyPageName() {
  var p = getPage();
  if (p) p.name = document.getElementById('page-name-input').value || p.name;
}

function renderEditor() {
  var p = getPage(); if (!p) return;
  // Ensure background exists (migration)
  if (!p.background) p.background = { type: 'none', value: '' };

  document.getElementById('page-name-input').value = p.name;
  var lockBtn = document.getElementById('toggle-lock-btn');
  lockBtn.textContent = p.locked ? '🔓 בטל נעילה' : '🔒 נעל דף';
  // FIX: correctly set the class on the button in the topbar
  lockBtn.className = 'btn-sm' + (p.locked ? ' active-lock' : '');

  var area = document.getElementById('elements-area');
  area.innerHTML = '';

  // ── Background section ──
  area.appendChild(buildBgRow(p));

  if (!p.elements.length) {
    var em = document.createElement('div');
    em.className = 'empty-state';
    em.innerHTML = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg><p>הוסף אלמנטים לדף זה</p>';
    area.appendChild(em);
  } else {
    p.elements.forEach(function(el, i) { area.appendChild(buildElItem(el, i)); });
  }
  renderPreview();
}

// ─── PER-PAGE BACKGROUND ROW ───
function buildBgRow(p) {
  var bg  = p.background;
  var row = document.createElement('div');
  row.className = 'bg-row';

  row.innerHTML =
    '<label>🎨 רקע הדף</label>' +
    '<div class="bg-options">' +
      '<button class="bg-type-btn' + (bg.type==='none'?' active':'') + '" data-bgtype="none">ללא</button>' +
      '<button class="bg-type-btn' + (bg.type==='color'?' active':'') + '" data-bgtype="color">צבע</button>' +
      '<button class="bg-type-btn' + (bg.type==='image'?' active':'') + '" data-bgtype="image">תמונה</button>' +
      (bg.type==='color' ? '<input type="color" class="bg-color-input" id="bg-color-pick" value="' + escHtml(bg.value||'#0D1124') + '">' : '') +
      (bg.type==='image' ? '<label class="bg-upload-btn">📷 העלה תמונה<input type="file" id="bg-img-upload" accept="image/*"></label>' : '') +
      (bg.type!=='none'  ? '<button class="bg-clear" id="bg-clear-btn">✕ נקה</button>' : '') +
      (bg.type==='color' ? '<div class="bg-preview-swatch" style="background:' + escHtml(bg.value||'#0D1124') + '"></div>' : '') +
      (bg.type==='image' && bg.value ? '<span style="font-size:11px;color:#7EC897">✓ תמונת רקע</span>' : '') +
    '</div>';

  // Type buttons — FIX: addEventListener
  row.querySelectorAll('[data-bgtype]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      p.background.type  = btn.dataset.bgtype;
      if (btn.dataset.bgtype === 'none') p.background.value = '';
      renderEditor();
      renderPreview();
    });
  });

  // Color picker
  var colorPick = row.querySelector('#bg-color-pick');
  if (colorPick) {
    colorPick.addEventListener('input', function() {
      p.background.value = colorPick.value;
      var swatch = row.querySelector('.bg-preview-swatch');
      if (swatch) swatch.style.background = colorPick.value;
      renderPreview();
    });
    colorPick.addEventListener('change', function() {
      p.background.value = colorPick.value;
      var swatch = row.querySelector('.bg-preview-swatch');
      if (swatch) swatch.style.background = colorPick.value;
      renderPreview();
    });
  }

  // Image upload
  var imgUp = row.querySelector('#bg-img-upload');
  if (imgUp) {
    imgUp.addEventListener('change', function() {
      var file = imgUp.files[0]; if (!file) return;
      if (file.size > 5 * 1024 * 1024) { notify('תמונת רקע גדולה מדי (מקסימום 5MB)'); return; }
      notify('טוען רקע...');
      var reader = new FileReader();
      reader.onload = function(ev) {
        p.background.value = ev.target.result;
        renderEditor();
        renderPreview();
        notify('רקע הוגדר! ✓');
      };
      reader.readAsDataURL(file);
    });
  }

  // Clear
  var clearBtn = row.querySelector('#bg-clear-btn');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      p.background = { type: 'none', value: '' };
      renderEditor();
      renderPreview();
    });
  }

  return row;
}

  });

  // File upload events — FIX: addEventListener
  wrap.querySelectorAll('[data-upload]').forEach(function(fileInput) {
    fileInput.addEventListener('change', function() {
      var file       = fileInput.files[0]; if (!file) return;
      var elId       = fileInput.dataset.id;
      var uploadType = fileInput.dataset.upload;
      var target     = getPage().elements.find(function(e) { return e.id === elId; }); if (!target) return;
      var limits     = { image: 8, audio: 15, video: 80 };
      var maxMB      = limits[uploadType] || 10;
      if (file.size > maxMB * 1024 * 1024) { notify('הקובץ גדול מדי (מקסימום ' + maxMB + 'MB)'); return; }
      notify('טוען קובץ...');
      var reader = new FileReader();
      reader.onload = function(ev) {
        target.src      = ev.target.result;
        target.fileName = file.name;
        renderEditor();
        notify('הקובץ הועלה! ✓');
      };
      reader.onerror = function() { notify('שגיאה בטעינת הקובץ'); };
      reader.readAsDataURL(file);
    });
  });

  // Move / delete — FIX: addEventListener
  wrap.querySelectorAll('[data-action]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var action = btn.dataset.action;
      var i      = parseInt(btn.dataset.idx, 10);
      var els    = getPage().elements;
      var tmp;
      if (action === 'del') {
        els.splice(i, 1);
        renderEditor();
      } else if (action === 'up' && i > 0) {
        tmp = els[i-1]; els[i-1] = els[i]; els[i] = tmp;
        renderEditor();
      } else if (action === 'down' && i < els.length-1) {
        tmp = els[i]; els[i] = els[i+1]; els[i+1] = tmp;
        renderEditor();
      }
    });
  });

  return wrap;
}

function renderPreview() {
  var pane = document.getElementById('preview-inner');
  var p    = getPage();
  pane.innerHTML = '';
  if (!p) return;
  p.elements.forEach(function(e) {
    var el = buildViewElement(e);
    el.style.cssText = 'transform:scale(0.8);transform-origin:top center;margin-bottom:-16px';
    pane.appendChild(el);
  });
}

// ─── BOOTSTRAP ───
loadState();
renderViewer();
</script>
</body>
</html>
