<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסע יום הולדת ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  transition: all 0.5s ease;
  background: linear-gradient(to bottom, #ffb6c1 50%, #ffffff 50%);
}

.topbar {
  background: #000;
  color: white;
  padding: 8px;
}

.container { padding: 15px; }

.card {
  background: rgba(255,255,255,0.95);
  padding: 20px;
  border-radius: 15px;
  margin-top: 15px;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
  cursor: pointer;
}

.admin {
  display: none;
  margin-top: 15px;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

.pageList {
  margin-top: 10px;
  text-align: right;
  max-height: 150px;
  overflow-y: auto;
  border-top: 1px solid #ddd;
  padding-top: 10px;
}

.pageItem {
  padding: 6px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
}

.pageItem:hover {
  background: #f2f2f2;
}

input, textarea {
  width: 90%;
  margin: 5px;
  padding: 8px;
}
</style>
</head>

<body>

<div class="topbar">
🕒 <span id="clock"></span>
</div>

<div class="container">

<h1 id="title"></h1>

<div class="card">
<p id="text"></p>
<img id="img" style="max-width:100%;display:none;">
<audio id="audio" controls style="width:100%;display:none;"></audio>
</div>

<div>
<!-- כפתורי ניווט (הוחלפו לפי בקשתך) -->
<button onclick="prev()">⬅ קודם</button>
<button onclick="next()">הבא ➡</button>

<button onclick="addPage()">➕ דף</button>
<button onclick="toggleAdmin()">🔐 אדמין</button>
</div>

<div class="admin" id="adminPanel">

<h3>עריכת דף נוכחי</h3>

<input id="titleInput" placeholder="כותרת">
<textarea id="textInput" placeholder="טקסט"></textarea>

<input id="colorInput" placeholder="צבע רקע">

<label>תמונה</label>
<input type="file" onchange="loadImage(event)">

<label>סאונד</label>
<input type="file" onchange="loadAudio(event)">

<label>תזמון</label>
<input id="timeInput" placeholder="YYYY-MM-DD HH:MM">

<button onclick="save()">💾 שמור דף</button>

<div class="pageList" id="pageList"></div>

</div>

</div>

<script>

let admin = false;
let index = 0;

let pages = JSON.parse(localStorage.getItem("pages")) || [
{
title: "ברוכה הבאה ❤️",
text: "זה רק ההתחלה...",
color: "#ffb6c1",
img: "",
audio: "",
bg: "",
time: ""
}
];

function saveData(){
localStorage.setItem("pages", JSON.stringify(pages));
}

/* שעון */
setInterval(()=>{
document.getElementById("clock").innerText = new Date().toLocaleString();
},1000);

/* בדיקת זמן */
function isOpen(p){
if(!p.time) return true;
return new Date() >= new Date(p.time);
}

/* רינדור */
function render(){

let p = pages[index];
let locked = !isOpen(p) && !admin;

/* אם נעול - רק הודעה */
if(locked){
document.getElementById("title").innerText = "⏳ דף נעול עדיין";
document.getElementById("text").innerText = "הדף ייפתח בזמן שנקבע";
document.getElementById("img").style.display = "none";
document.getElementById("audio").style.display = "none";
document.body.style.background = "#ddd";
} 
else {

document.body.style.background = p.bg ? `url(${p.bg})` : p.color;

document.getElementById("title").innerText = p.title;
document.getElementById("text").innerText = p.text;

let img = document.getElementById("img");
if(p.img){ img.src = p.img; img.style.display="block"; }
else img.style.display="none";

let audio = document.getElementById("audio");
if(p.audio){ audio.src = p.audio; audio.style.display="block"; }
else audio.style.display="none";

}

/* אדמין */
document.getElementById("adminPanel").style.display = admin ? "block" : "none";

if(admin){
titleInput.value = p.title;
textInput.value = p.text;
colorInput.value = p.color;
timeInput.value = p.time || "";
renderPageList();
}
}

/* רשימת דפים */
function renderPageList(){
let list = document.getElementById("pageList");
list.innerHTML = "";

pages.forEach((p,i)=>{
let div = document.createElement("div");
div.className = "pageItem";
div.innerText = (i+1) + ". " + (p.title || "ללא כותרת");
div.onclick = ()=>{
index = i;
render();
};
list.appendChild(div);
});
}

/* אדמין */
function toggleAdmin(){
let pass = prompt("סיסמה");
if(pass === "1234"){
admin = !admin;
render();
}else alert("שגיאה");
}

/* שמירה */
function save(){
pages[index].title = titleInput.value;
pages[index].text = textInput.value;
pages[index].color = colorInput.value;
pages[index].time = timeInput.value;

saveData();
render();
}

/* דף חדש */
function addPage(){
pages.push({
title:"דף חדש",
text:"תוכן חדש",
color:"#ffffff",
img:"",
audio:"",
bg:"",
time:""
});
index = pages.length-1;
saveData();
render();
}

/* קבצים */
function loadImage(e){
let r = new FileReader();
r.onload = ev=>{
pages[index].img = ev.target.result;
saveData();
render();
};
r.readAsDataURL(e.target.files[0]);
}

function loadAudio(e){
let r = new FileReader();
r.onload = ev=>{
pages[index].audio = ev.target.result;
saveData();
render();
};
r.readAsDataURL(e.target.files[0]);
}

/* ניווט */
function next(){
if(index < pages.length-1){
index++;
render();
}
}

function prev(){
if(index > 0){
index--;
render();
}
}

render();

</script>

</body>
</html>
