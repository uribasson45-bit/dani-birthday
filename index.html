<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daniel Birthday Story ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* Existing styles omitted for brevity */
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <div id="progress-bar"></div>
  <div id="pages-wrap"></div>
  <div id="nav">
    <button class="nav-btn" id="btn-next" title="הבא">→</button>
    <span id="page-counter">1 / 1</span>
    <button class="nav-btn" id="btn-prev" title="הקודם">←</button>
  </div>
</div>

<button id="admin-trigger" title="Admin">⚙</button>

<div id="admin-login">
  <div class="login-card">
    <h2>כניסת עורך</h2>
    <p>הכנס סיסמה כדי לערוך את הסיפור</p>
    <input type="password" id="login-pw" placeholder="••••" maxlength="20" autocomplete="current-password">
    <button class="btn-primary" id="login-btn">כניסה</button>
    <p class="error" id="login-err"></p>
  </div>
</div>

<div id="admin-panel">
  <div class="admin-topbar">
    <h1>Daniel Birthday Story ✦</h1>
    <input id="page-name-input" placeholder="שם הדף..." />
    <button class="btn-sm" id="toggle-lock-btn">🔒 נעל דף</button>
    <button class="btn-sm primary" id="save-btn">שמור</button>
    <button class="btn-sm danger" id="exit-admin-btn">יציאה</button>
  </div>
  <div class="admin-body">
    <div id="preview-pane">
      <div class="preview-header">תצוגה מקדימה</div>
      <div id="preview-inner"></div>
    </div>
    <div id="editor-main">
      <div id="editor-toolbar">
        <button class="tool-btn" id="add-heading">✦ כותרת</button>
        <button class="tool-btn" id="add-subheading">✧ כותרת משנה</button>
        <button class="tool-btn" id="add-text">¶ טקסט</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="add-image">🖼 תמונה</button>
        <button class="tool-btn" id="add-audio">🎵 אודיו</button>
        <button class="tool-btn" id="add-video">🎬 וידאו MP4</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="del-page-btn" style="color:var(--rose)">🗑 מחק דף</button>
      </div>
      <div id="elements-area">
        <div class="empty-state" id="empty-el">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
          <p>בחר דף מהרשימה ואז הוסף אלמנטים</p>
        </div>
      </div>
    </div>
    <div id="pages-sidebar">
      <div class="sidebar-header">
        <span>דפים</span>
        <button class="sidebar-add" id="add-page-btn" title="הוסף דף">+</button>
      </div>
      <div id="pages-list"></div>
    </div>
  </div>
</div>

<div id="notif">נשמר! ✓</div>

<script>
// ─── STATE ───
const ADMIN_PASSWORD = '1234';
const STORAGE_KEY = 'birthday_story_v4';
let state = {
  pages: [
    {
      id: uid(), name: 'עמוד 1', locked: false, background: '#FAF6EF', // Added background property
      elements: [
        {id: uid(), type: 'heading', value: 'יום הולדת שמח! 🎂'},
        {id: uid(), type: 'subheading', value: 'לך, האהוב שלי'},
        {id: uid(), type: 'text', value: 'זה הסיפור שלנו. לחץ ← כדי להמשיך...'}
      ]
    }
  ],
  currentPage: 0
};
let adminMode = false;
let selectedPageIdx = 0;
let touchStartX = 0, touchStartY = 0;

// ─── FIXES (iOS + Chrome stability) ───
const FILE_LIMITS = {
  image: 8,
  audio: 15,
  video: 120
};

// ─── UTILS ───
function uid() { return Math.random().toString(36).slice(2); }
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&').replace(/</g, '<')
    .replace(/>/g, '>').replace(/"/g, '"');
}

function safeNotify(msg) {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 2200);
}

// ─── PERSISTENCE ───
function loadState() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) state = JSON.parse(s); } catch (e) {}
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    notify('נשמר! ✓');
  } catch (e) { notify('שגיאה בשמירה – הקבצים גדולים מדי'); }
}

// ─── VIEWER ───
function renderViewer() {
  const wrap = document.getElementById('pages-wrap');
  const pb = document.getElementById('progress-bar');
  const counter = document.getElementById('page-counter');
  const cur = state.currentPage, total = state.pages.length;

  pb.innerHTML = '';
  state.pages.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'prog-dot' + (i === cur ? ' active' : i < cur ? ' done' : '');
    d.title = p.name;
    d.onclick = () => { if (i <= cur) navigateTo(i); };
    pb.appendChild(d);
  });
  counter.textContent = `${cur + 1} / ${total}`;

  wrap.innerHTML = '';
  state.pages.forEach((page, i) => {
    const el = document.createElement('div');
    el.className = 'page' + (i === cur ? ' active' : i < cur ? ' exit-left' : ' exit-right');
    el.dataset.idx = i;
    el.style.background = page.background; // Set background color/image
    page.elements.forEach(e => el.appendChild(buildViewElement(e)));
    if (page.locked) {
      const lo = document.createElement('div');
      lo.className = 'lock-overlay';
      lo.innerHTML = `<div class="lock-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="lock-label">הדף נעול</div><div class="lock-hint">דף זה טרם נפתח</div>`;
      el.appendChild(lo);
    }
    wrap.appendChild(el);
  });

  document.getElementById('btn-prev').disabled = (cur >= total - 1);
  document.getElementById('btn-next').disabled = (cur <= 0);
}

// ─── NAVIGATION ───
function navigateTo(idx) {
  if (!state.pages[idx]) return;

  // Allow going back even if the page is locked
  if (state.pages[idx].locked && idx < state.currentPage) return;

  state.currentPage = idx;
  renderViewer();
}

function prevPage() {
  if (state.currentPage < state.pages.length - 1) {
    navigateTo(state.currentPage + 1);
  }
}

function nextPage() {
  const cp = state.currentPage;
  if (state.pages[cp] && state.pages[cp].locked) return;
  navigateTo(cp - 1);
}

document.getElementById('btn-prev').onclick = prevPage;
document.getElementById('btn-next').onclick = nextPage;

// ─── ADMIN LOGIN ───
document.getElementById('admin-trigger').onclick = () => {
  if (adminMode) { exitAdmin(); return; }
  document.getElementById('admin-login').style.display = 'flex';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-err').textContent = '';
  setTimeout(() => document.getElementById('login-pw').focus(), 100);
};

document.getElementById('login-btn').onclick = doLogin;
document.getElementById('login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogin() {
  const pw = document.getElementById('login-pw').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('admin-login').style.display = 'none';
    enterAdmin();
  } else {
    document.getElementById('login-err').textContent = 'סיסמה שגויה, נסה שוב';
    document.getElementById('login-pw').value = '';
  }
}

function enterAdmin() {
  adminMode = true;
  document.getElementById('admin-panel').style.display = 'flex';
  selectedPageIdx = state.currentPage;
  renderAdminSidebar(); renderEditor();
}

function exitAdmin() {
  adminMode = false;
  document.getElementById('admin-panel').style.display = 'none';
  renderViewer();
}

document.getElementById('exit-admin-btn').onclick = exitAdmin;
document.getElementById('save-btn').onclick = () => { applyPageName(); saveState(); renderViewer(); };

// ─── EDITOR ───
function getPage() { return state.pages[selectedPageIdx]; }
function applyPageName() {
  const p = getPage();
  if (p) p.name = document.getElementById('page-name-input').value || p.name;
}

// Building the editor interface
function renderEditor() {
  const p = getPage(); if (!p) return;
  document.getElementById('page-name-input').value = p.name;
  const lockBtn = document.getElementById('toggle-lock-btn');
  lockBtn.textContent = p.locked ? '🔓 בטל נעילה' : '🔒 נעל דף';
  lockBtn.className = 'btn-sm' + (p.locked ? ' active-lock' : '');
  const area = document.getElementById('elements-area');
  if (!p.elements.length) {
    area.innerHTML = '';
    const em = document.createElement('div'); em.className = 'empty-state';
    em.innerHTML = `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg><p>הוסף אלמנטים לדף זה</p>`;
    area.appendChild(em);
  } else {
    area.innerHTML = '';
    p.elements.forEach((el, i) => area.appendChild(buildElItem(el, i)));
  }
}

// ─── BUILD ELEMENT EDITOR ITEM ───
function buildElItem(el, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'el-item';
  const typeName = { heading: 'כותרת', subheading: 'כותרת משנה', text: 'טקסט', subtitle: 'תת-כותרת', image: 'תמונה', audio: 'אודיו', video: 'וידאו MP4' }[el.type] || el.type;
  let inner = '';

  if (['heading', 'subheading', 'text', 'subtitle'].includes(el.type)) {
    const isTA = el.type === 'text';
    inner = `<div class="el-row"><label>תוכן</label>${isTA ? `<textarea data-field="value" data-id="${el.id}">${escHtml(el.value)}</textarea>` : `<input type="text" data-field="value" data-id="${el.id}" value="${escHtml(el.value)}">`}</div>`;
  } else if (el.type === 'image') {
    const previewHtml = el.src ? `<img class="img-preview" src="${el.src}" alt="" style="position: absolute; top: ${el.top}px; left: ${el.left}px;">` : '';
    const fileName = el.fileName ? `<div class="upload-status ok">✓ ${escHtml(el.fileName)}</div>` : '';
    const sizeVal = el.size || 'medium';
    inner = `
      <div class="el-row">
        <label>העלאת תמונה מהמכשיר</label>
        <label class="upload-btn">📁 בחר תמונה<input type="file" accept="image/*" data-upload="image" data-id="${el.id}"></label>
        ${fileName}${previewHtml}
      </div>
      <div class="el-row">
        <label>או הכנס URL (אופציונלי)</label>
        <input type="text" data-field="src" data-id="${el.id}" value="${escHtml(el.src || '')}" placeholder="https://...">
      </div>
      <div class="el-row">
        <label>גודל תמונה</label>
        <select class="size-select" data-field="size" data-id="${el.id}">
          <option value="small" ${sizeVal === 'small' ? 'selected' : ''}>קטן</option>
          <option value="medium" ${sizeVal === 'medium' ? 'selected' : ''}>בינוני (ברירת מחדל)</option>
          <option value="large" ${sizeVal === 'large' ? 'selected' : ''}>גדול</option>
          <option value="full" ${sizeVal === 'full' ? 'selected' : ''}>מלא</option>
        </select>
      </div>
      <div class="el-row">
        <label>תיאור נגישות</label>
        <input type="text" data-field="alt" data-id="${el.id}" value="${escHtml(el.alt || '')}">
      </div>
      <div class="el-row">
        <label>מיקום על העמוד (Top, Left)</label>
        <input type="number" data-field="top" data-id="${el.id}" value="${el.top || 0}" placeholder="Top (px)">
        <input type="number" data-field="left" data-id="${el.id}" value="${el.left || 0}" placeholder="Left (px)">
      </div>`;
  } else if (el.type === 'audio') {
    const fileName = el.fileName ? `<div class="upload-status ok">✓ ${escHtml(el.fileName)}</div>` : '';
    inner = `
      <div class="row2">
        <div class="el-row"><label>כותרת</label><input type="text" data-field="label" data-id="${el.id}" value="${escHtml(el.label || '')}"></div>
        <div class="el-row"><label>הפעלה אוטומטית</label>
          <select data-field="autoplay" data-id="${el.id}">
            <option value="false" ${!el.autoplay ? 'selected' : ''}>לא</option>
            <option value="true" ${el.autoplay ? 'selected' : ''}>כן</option>
          </select>
        </div>
      </div>
      <div class="el-row">
        <label>העלאת קובץ אודיו מהמכשיר (MP3, M4A, WAV)</label>
        <label class="upload-btn">🎵 בחר קובץ אודיו<input type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg" data-upload="audio" data-id="${el.id}"></label>
        ${fileName}
      </div>
      <div class="el-row">
        <label>או הכנס URL (אופציונלי)</label>
        <input type="text" data-field="src" data-id="${el.id}" value="${escHtml(el.src || '')}" placeholder="https://...mp3">
      </div>`;
  } else if (el.type === 'video') {
    const fileName = el.fileName ? `<div class="upload-status ok">✓ ${escHtml(el.fileName)}</div>` : '';
    inner = `
      <div class="row2">
        <div class="el-row"><label>כותרת (אופציונלי)</label><input type="text" data-field="label" data-id="${el.id}" value="${escHtml(el.label || '')}"></div>
        <div class="el-row"><label>הפעלה אוטומטית (ללא קול)</label>
          <select data-field="autoplay" data-id="${el.id}">
            <option value="false" ${!el.autoplay ? 'selected' : ''}>לא</option>
            <option value="true" ${el.autoplay ? 'selected' : ''}>כן (ללא קול)</option>
          </select>
        </div>
      </div>
      <div class="el-row">
        <label>העלאת קובץ וידאו מהמכשיר (MP4, MOV, WebM)</label>
        <label class="upload-btn">🎬 בחר קובץ וידאו<input type="file" accept="video/*,.mp4,.mov,.webm,.m4v" data-upload="video" data-id="${el.id}"></label>
        ${fileName}
      </div>
      <div class="el-row">
        <label>או הכנס URL לוידאו (אופציונלי)</label>
        <input type="text" data-field="src" data-id="${el.id}" value="${escHtml(el.src || '')}" placeholder="https://...mp4">
      </div>
      <div class="upload-status" style="color:var(--text-muted);font-size:11px">⚠ קבצי וידאו גדולים (מעל 50MB) עלולים לגרום לבעיות בשמירה. מומלץ לדחוס לפני העלאה.</div>`;
  }

  wrap.innerHTML = `
    <div class="el-item-header">
      <span class="el-type-badge">${typeName}</span>
      <div class="el-item-actions">
        ${idx > 0 ? `<button class="el-action-btn" data-action="up" data-idx="${idx}">▲</button>` : ''}
        ${idx < (getPage().elements.length - 1) ? `<button class="el-action-btn" data-action="down" data-idx="${idx}">▼</button>` : ''}
        <button class="el-action-btn del" data-action="del" data-idx="${idx}">✕</button>
      </div>
    </div>${inner}`;

  // Field input events
  wrap.querySelectorAll('[data-field]').forEach(inp => {
    const field = inp.dataset.field;
    const elId = inp.dataset.id;
    inp.addEventListener('input', () => {
      const target = getPage().elements.find(e => e.id === elId); if (!target) return;
      let val = inp.value;
      if (field === 'autoplay') val = val === 'true';
      target[field] = val;
      renderPreview();
    });
    // Also listen for change on select
    if (inp.tagName === 'SELECT') inp.addEventListener('change', () => {
      const target = getPage().elements.find(e => e.id === elId); if (!target) return;
      let val = inp.value;
      if (field === 'autoplay') val = val === 'true';
      target[field] = val;
      renderPreview();
    });
  });

  // File upload events
  wrap.querySelectorAll('[data-upload]').forEach(fileInput => {
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0]; if (!file) return;
      const elId = fileInput.dataset.id;
      const uploadType = fileInput.dataset.upload;
      const target = getPage().elements.find(e => e.id === elId); if (!target) return;
      // Size limits: image 8MB, audio 15MB, video 80MB
      const limits = { image: 8, audio: 15, video: 80 };
      const maxMB = limits[uploadType] || 10;
      if (file.size > maxMB * 1024 * 1024) {
        notify(`הקובץ גדול מדי (מקסימום ${maxMB}MB)`); return;
      }
      notify('טוען קובץ...');
      const reader = new FileReader();
      reader.onload = ev => {
        target.src = ev.target.result;
        target.fileName = file.name;
        renderEditor();
        notify('הקובץ הועלה! ✓');
      };
      reader.onerror = () => notify('שגיאה בטעינת הקובץ');
      reader.readAsDataURL(file);
    });
  });

  // Move/delete
  wrap.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const action = btn.dataset.action, i = parseInt(btn.dataset.idx);
      const els = getPage().elements;
      if (action === 'del') { els.splice(i, 1); renderEditor(); }
      else if (action === 'up') { [els[i - 1], els[i]] = [els[i], els[i - 1]]; renderEditor(); }
      else if (action === 'down') { [els[i], els[i + 1]] = [els[i + 1], els[i]]; renderEditor(); }
    };
  });

  return wrap;
}

function renderPreview() {
  const pane = document.getElementById('preview-inner');
  const p = getPage(); pane.innerHTML = ''; if (!p) return;
  p.elements.forEach(e => {
    const el = buildViewElement(e);
    el.style.cssText = 'transform:scale(0.8);transform-origin:top center;margin-bottom:-16px';
    pane.appendChild(el);
  });
}

// ─── BOOTSTRAP ───
loadState();
renderViewer();
</script>
</body>
</html>
