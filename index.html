<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Story</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#C9A84C;
    --gold-light:#E8D5A3;
    --rose:#C97B84;
    --navy:#1A1F3A;
    --navy-deep:#0D1124;
    --cream:#FAF6EF;
    --text-light:#F5F0E8;
    --text-muted:#A09070;
    --card-bg:rgba(255,255,255,0.06);
    --border:rgba(201,168,76,0.25);
  }
  html,body{height:100%;overflow:hidden;background:var(--navy-deep);font-family:'Lato',sans-serif;color:var(--text-light)}

  /* ─── STARS BACKGROUND ─── */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) infinite var(--delay,0s)}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}

  /* ─── VIEWER ─── */
  #app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}

  /* Progress bar */
  #progress-bar{display:flex;gap:6px;padding:16px 20px 8px;justify-content:center;flex-shrink:0}
  .prog-dot{flex:1;max-width:60px;height:3px;border-radius:2px;background:rgba(255,255,255,0.2);transition:background .3s;cursor:pointer}
  .prog-dot.active{background:var(--gold)}
  .prog-dot.done{background:rgba(201,168,76,0.5)}

  /* Page container */
  #pages-wrap{flex:1;position:relative;overflow:hidden}
  .page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;transition:transform .5s cubic-bezier(.77,0,.18,1),opacity .4s;opacity:0;pointer-events:none;transform:translateX(100%);overflow-y:auto}
  .page.active{opacity:1;pointer-events:all;transform:translateX(0)}
  .page.exit-left{transform:translateX(-100%);opacity:0}
  .page.exit-right{transform:translateX(100%);opacity:0}

  /* Page elements */
  .el-text{text-align:center;max-width:560px;width:100%;margin:10px 0}
  .el-text h1{font-family:'Playfair Display',serif;font-size:clamp(26px,6vw,52px);font-weight:600;line-height:1.2;color:var(--gold-light);margin-bottom:10px}
  .el-text h2{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,36px);font-weight:400;font-style:italic;color:var(--rose);margin-bottom:8px}
  .el-text p{font-size:clamp(14px,3vw,18px);line-height:1.8;font-weight:300;color:var(--text-light);opacity:.9}
  .el-text .subtitle{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:700}

  .el-image{max-width:min(480px,90vw);max-height:50vh;border-radius:12px;overflow:hidden;margin:10px 0;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--border)}
  .el-image img{width:100%;height:100%;object-fit:cover;display:block}
  .el-image .img-placeholder{width:100%;height:220px;background:var(--card-bg);border:1px dashed var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;gap:8px}
  .el-image .img-placeholder svg{opacity:.4}

  .el-audio{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px 20px;max-width:400px;width:100%;margin:10px 0}
  .el-audio .audio-title{font-size:13px;color:var(--gold);margin-bottom:12px;font-weight:700;letter-spacing:1px}
  .el-audio .audio-controls{display:flex;align-items:center;gap:12px}
  .el-audio .audio-btn{width:42px;height:42px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,background .2s}
  .el-audio .audio-btn:hover{background:var(--gold-light);transform:scale(1.08)}
  .el-audio .audio-progress-wrap{flex:1;display:flex;flex-direction:column;gap:6px}
  .el-audio .audio-track{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.15);border-radius:2px;cursor:pointer;outline:none}
  .el-audio .audio-track::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer}
  .el-audio .audio-time{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}
  .el-audio .audio-restart{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;transition:color .2s,border-color .2s}
  .el-audio .audio-restart:hover{color:var(--gold);border-color:var(--gold)}

  /* Lock overlay */
  .lock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,36,.92);backdrop-filter:blur(12px);z-index:10;gap:20px}
  .lock-icon{width:72px;height:72px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pulse-lock 2s infinite}
  @keyframes pulse-lock{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.4)}50%{box-shadow:0 0 0 14px rgba(201,168,76,0)}}
  .lock-label{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold-light)}
  .lock-hint{font-size:13px;color:var(--text-muted);letter-spacing:1px}

  /* Nav buttons */
  #nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 20px;flex-shrink:0}
  .nav-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text-light);width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;font-size:20px}
  .nav-btn:hover:not(:disabled){background:rgba(201,168,76,.15);transform:scale(1.08)}
  .nav-btn:disabled{opacity:.3;cursor:default}
  #page-counter{font-size:13px;color:var(--text-muted);letter-spacing:1px}

  /* ─── ADMIN ─── */
  #admin-login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(13,17,36,.97);backdrop-filter:blur(20px);display:none}
  .login-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:40px 36px;max-width:360px;width:100%;text-align:center}
  .login-card h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-light);margin-bottom:8px}
  .login-card p{font-size:13px;color:var(--text-muted);margin-bottom:28px}
  .login-card input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:14px 18px;color:#fff;font-size:18px;text-align:center;letter-spacing:8px;outline:none;margin-bottom:16px;transition:border-color .2s}
  .login-card input:focus{border-color:var(--gold)}
  .login-card .btn-primary{width:100%;padding:14px;background:var(--gold);color:var(--navy-deep);border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s}
  .login-card .btn-primary:hover{background:var(--gold-light)}
  .login-card .error{color:var(--rose);font-size:13px;margin-top:8px}

  #admin-panel{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:var(--navy-deep)}
  .admin-topbar{background:rgba(26,31,58,.95);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px}
  .admin-topbar h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);flex:1}
  .admin-topbar .btn-sm{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-light);transition:background .2s}
  .admin-topbar .btn-sm:hover{background:var(--card-bg)}
  .admin-topbar .btn-sm.danger{border-color:var(--rose);color:var(--rose)}
  .admin-topbar .btn-sm.primary{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
  .admin-topbar .btn-sm.primary:hover{background:var(--gold-light)}

  .admin-body{display:flex;flex:1;overflow:hidden}

  /* Pages sidebar */
  #pages-sidebar{width:220px;background:rgba(26,31,58,.7);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  .sidebar-header{padding:14px 16px;font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .sidebar-add{background:none;border:none;color:var(--gold);cursor:pointer;font-size:20px;line-height:1;transition:transform .2s}
  .sidebar-add:hover{transform:scale(1.2)}
  #pages-list{flex:1;overflow-y:auto;padding:8px}
  .page-thumb{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s;display:flex;align-items:center;gap:8px;position:relative}
  .page-thumb:hover{border-color:var(--gold);background:rgba(201,168,76,.06)}
  .page-thumb.selected{border-color:var(--gold);background:rgba(201,168,76,.1)}
  .page-thumb .pg-num{font-size:11px;color:var(--text-muted);min-width:20px}
  .page-thumb .pg-name{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page-thumb .pg-lock{font-size:14px;color:var(--text-muted)}
  .page-thumb .pg-del{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--rose);cursor:pointer;font-size:14px;opacity:0;transition:opacity .2s;padding:4px}
  .page-thumb:hover .pg-del{opacity:1}

  /* Editor main */
  #editor-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  #editor-toolbar{border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;background:rgba(13,17,36,.5)}
  .tool-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-light);transition:background .2s,border-color .2s;display:flex;align-items:center;gap:6px;letter-spacing:.5px}
  .tool-btn:hover{background:var(--card-bg);border-color:var(--gold);color:var(--gold)}
  .tool-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
  .tool-btn.active-lock{border-color:var(--rose);color:var(--rose)}
  #page-name-input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-light);font-size:14px;padding:4px 8px;outline:none;width:180px;transition:border-color .2s}
  #page-name-input:focus{border-color:var(--gold)}

  /* Element list */
  #elements-area{flex:1;overflow-y:auto;padding:20px}
  .el-item{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;position:relative}
  .el-item-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .el-type-badge{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--gold);background:rgba(201,168,76,.1);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
  .el-item-actions{margin-right:auto;display:flex;gap:6px}
  .el-action-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text-muted);cursor:pointer;transition:color .2s,border-color .2s}
  .el-action-btn:hover{color:var(--gold);border-color:var(--gold)}
  .el-action-btn.del:hover{color:var(--rose);border-color:var(--rose)}
  .el-row{display:flex;flex-direction:column;gap:8px}
  .el-row label{font-size:11px;color:var(--text-muted);letter-spacing:1px;font-weight:700}
  .el-row input,.el-row select,.el-row textarea{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;outline:none;transition:border-color .2s;font-family:inherit}
  .el-row input:focus,.el-row select:focus,.el-row textarea:focus{border-color:var(--gold)}
  .el-row textarea{resize:vertical;min-height:80px;line-height:1.6}
  .el-row select option{background:var(--navy)}
  .el-row .img-upload-area{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:border-color .2s;color:var(--text-muted);font-size:13px}
  .el-row .img-upload-area:hover{border-color:var(--gold);color:var(--gold)}
  .el-row .img-preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px;object-fit:cover}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .empty-state svg{opacity:.2;margin-bottom:16px}
  .empty-state p{font-size:14px}

  /* Preview pane */
  #preview-pane{width:300px;border-right:1px solid var(--border);background:rgba(13,17,36,.7);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  .preview-header{padding:12px 16px;font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;border-bottom:1px solid var(--border)}
  #preview-inner{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:14px}

  /* Notification */
  #notif{position:fixed;bottom:30px;right:50%;transform:translateX(50%);background:var(--gold);color:var(--navy-deep);padding:10px 24px;border-radius:30px;font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
  #notif.show{opacity:1}

  /* Admin trigger */
  #admin-trigger{position:fixed;bottom:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);transition:color .3s,border-color .3s}
  #admin-trigger:hover{color:var(--gold);border-color:var(--gold)}

  /* Scrollbars */
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

  /* Mobile */
  @media(max-width:700px){
    #pages-sidebar{width:180px}
    #preview-pane{display:none}
    .admin-topbar h1{font-size:16px}
  }
  @media(max-width:520px){
    #pages-sidebar{display:none}
    #admin-panel .admin-topbar{flex-wrap:wrap}
  }
</style>
</head>
<body>

<!-- STARS -->
<div id="stars"></div>

<!-- VIEWER -->
<div id="app">
  <div id="progress-bar"></div>
  <div id="pages-wrap"></div>
  <div id="nav">
    <button class="nav-btn" id="btn-next" title="הבא">&#8594;</button>
    <span id="page-counter">1 / 1</span>
    <button class="nav-btn" id="btn-prev" title="הקודם">&#8592;</button>
  </div>
</div>

<!-- ADMIN TRIGGER -->
<button id="admin-trigger" title="Admin">⚙</button>

<!-- ADMIN LOGIN -->
<div id="admin-login">
  <div class="login-card">
    <h2>כניסת עורך</h2>
    <p>הכנס סיסמה כדי לערוך את הסיפור</p>
    <input type="password" id="login-pw" placeholder="••••" maxlength="20">
    <button class="btn-primary" id="login-btn">כניסה</button>
    <p class="error" id="login-err"></p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <div class="admin-topbar">
    <h1>✦ Birthday Story Editor</h1>
    <input id="page-name-input" placeholder="שם הדף..." />
    <button class="btn-sm" id="toggle-lock-btn">🔒 נעל דף</button>
    <button class="btn-sm primary" id="save-btn">שמור</button>
    <button class="btn-sm danger" id="exit-admin-btn">יציאה</button>
  </div>
  <div class="admin-body">
    <div id="preview-pane">
      <div class="preview-header">תצוגה מקדימה</div>
      <div id="preview-inner"></div>
    </div>
    <div id="editor-main">
      <div id="editor-toolbar">
        <button class="tool-btn" id="add-heading">✦ כותרת</button>
        <button class="tool-btn" id="add-subheading">✧ כותרת משנה</button>
        <button class="tool-btn" id="add-text">¶ טקסט</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="add-image">🖼 תמונה</button>
        <button class="tool-btn" id="add-audio">🎵 אודיו</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="del-page-btn" style="color:var(--rose)">🗑 מחק דף</button>
      </div>
      <div id="elements-area">
        <div class="empty-state" id="empty-el">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
          <p>בחר דף מהרשימה ואז הוסף אלמנטים</p>
        </div>
      </div>
    </div>
    <div id="pages-sidebar">
      <div class="sidebar-header">
        <span>דפים</span>
        <button class="sidebar-add" id="add-page-btn" title="הוסף דף">+</button>
      </div>
      <div id="pages-list"></div>
    </div>
  </div>
</div>

<!-- NOTIFICATION -->
<div id="notif" id="notif">נשמר! ✓</div>

<script>
// ─── STATE ───
const ADMIN_PASSWORD = '1234';
const STORAGE_KEY = 'birthday_story_v2';

let state = {
  pages: [
    {
      id: uid(),
      name: 'עמוד 1',
      locked: false,
      elements: [
        {id: uid(), type: 'heading', value: 'יום הולדת שמח! 🎂'},
        {id: uid(), type: 'subheading', value: 'לך, האהוב שלי'},
        {id: uid(), type: 'text', value: 'זה הסיפור שלנו. לחץ ← כדי להמשיך...'}
      ]
    }
  ],
  currentPage: 0
};

let adminMode = false;
let selectedPageIdx = 0;
let touchStartX = 0;

// ─── INIT ───
function uid(){return Math.random().toString(36).slice(2)}

function loadState(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s){state=JSON.parse(s)}}catch(e){}
}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
  notify('נשמר! ✓');
}

// Stars
(function createStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=Math.random()*2.5+0.5;
    s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${Math.random()*.5}`;
    c.appendChild(s);
  }
})();

// ─── VIEWER ───
function renderViewer(){
  const wrap=document.getElementById('pages-wrap');
  const pb=document.getElementById('progress-bar');
  const counter=document.getElementById('page-counter');
  const cur=state.currentPage;
  const total=state.pages.length;

  // Progress dots
  pb.innerHTML='';
  state.pages.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='prog-dot'+(i===cur?' active':i<cur?' done':'');
    d.title=p.name;
    d.onclick=()=>{if(i<=cur){navigateTo(i)}};
    pb.appendChild(d);
  });

  counter.textContent=`${cur+1} / ${total}`;

  // Pages
  wrap.innerHTML='';
  state.pages.forEach((page,i)=>{
    const el=document.createElement('div');
    el.className='page'+(i===cur?' active':i<cur?' exit-left':' exit-right');
    el.dataset.idx=i;

    // Elements
    page.elements.forEach(e=>{
      el.appendChild(buildViewElement(e));
    });

    // Lock overlay
    if(page.locked){
      const lo=document.createElement('div');
      lo.className='lock-overlay';
      lo.innerHTML=`<div class="lock-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="lock-label">הדף נעול</div><div class="lock-hint">דף זה טרם נפתח</div>`;
      el.appendChild(lo);
    }

    wrap.appendChild(el);
  });

  // Nav
  document.getElementById('btn-prev').disabled=(cur>=total-1);
  document.getElementById('btn-next').disabled=(cur<=0);
}

function buildViewElement(e){
  const wrap=document.createElement('div');
  if(e.type==='heading'){
    wrap.className='el-text';
    wrap.innerHTML=`<h1>${escHtml(e.value)}</h1>`;
  } else if(e.type==='subheading'){
    wrap.className='el-text';
    wrap.innerHTML=`<h2>${escHtml(e.value)}</h2>`;
  } else if(e.type==='text'){
    wrap.className='el-text';
    wrap.innerHTML=`<p>${escHtml(e.value).replace(/\n/g,'<br>')}</p>`;
  } else if(e.type==='subtitle'){
    wrap.className='el-text';
    wrap.innerHTML=`<div class="subtitle">${escHtml(e.value)}</div>`;
  } else if(e.type==='image'){
    wrap.className='el-image';
    if(e.src){
      wrap.innerHTML=`<img src="${e.src}" alt="${escHtml(e.alt||'')}">`;
    } else {
      wrap.innerHTML=`<div class="img-placeholder"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>תמונה</span></div>`;
    }
  } else if(e.type==='audio'){
    wrap.className='el-audio';
    const aid='audio_'+e.id;
    wrap.innerHTML=`<div class="audio-title">♪ ${escHtml(e.label||'מוזיקה')}</div>
      <audio id="${aid}" src="${e.src||''}" preload="metadata"></audio>
      <div class="audio-controls">
        <button class="audio-btn" data-aid="${aid}" data-action="playpause">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <div class="audio-progress-wrap">
          <input type="range" class="audio-track" data-aid="${aid}" min="0" max="100" value="0" step="0.1">
          <div class="audio-time"><span class="audio-cur" data-aid="${aid}">0:00</span><span class="audio-dur" data-aid="${aid}">0:00</span></div>
        </div>
        <button class="audio-restart" data-aid="${aid}" data-action="restart">↺</button>
      </div>`;
    setTimeout(()=>initAudioElement(aid,e.autoplay),100);
  }
  return wrap;
}

function initAudioElement(aid,autoplay){
  const audio=document.getElementById(aid);
  if(!audio)return;
  const playBtn=document.querySelector(`[data-aid="${aid}"][data-action="playpause"]`);
  const track=document.querySelector(`input.audio-track[data-aid="${aid}"]`);
  const curEl=document.querySelector(`.audio-cur[data-aid="${aid}"]`);
  const durEl=document.querySelector(`.audio-dur[data-aid="${aid}"]`);
  const restartBtn=document.querySelector(`[data-aid="${aid}"][data-action="restart"]`);

  const playIcon=`<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><polygon points="5,3 19,12 5,21"/></svg>`;
  const pauseIcon=`<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:var(--navy-deep)"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;

  function fmt(s){const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)+'').padStart(2,'0')}

  audio.addEventListener('loadedmetadata',()=>{durEl.textContent=fmt(audio.duration)});
  audio.addEventListener('timeupdate',()=>{
    if(!audio.duration)return;
    track.value=(audio.currentTime/audio.duration)*100;
    curEl.textContent=fmt(audio.currentTime);
  });
  audio.addEventListener('play',()=>{playBtn.innerHTML=pauseIcon});
  audio.addEventListener('pause',()=>{playBtn.innerHTML=playIcon});
  audio.addEventListener('ended',()=>{playBtn.innerHTML=playIcon;track.value=0;curEl.textContent='0:00'});

  if(playBtn)playBtn.onclick=()=>{audio.paused?audio.play().catch(()=>{}):audio.pause()};
  if(track)track.oninput=()=>{if(audio.duration)audio.currentTime=(track.value/100)*audio.duration};
  if(restartBtn)restartBtn.onclick=()=>{audio.currentTime=0;audio.play().catch(()=>{})};

  if(autoplay)audio.play().catch(()=>{});
}

function navigateTo(idx){
  const target=state.pages[idx];
  if(!target)return;
  // Don't allow jumping forward past current if locked
  if(idx>state.currentPage && state.pages[state.currentPage].locked)return;
  state.currentPage=idx;
  renderViewer();
}

function prevPage(){navigateTo(state.currentPage+1)}
function nextPage(){
  const cp=state.currentPage;
  if(state.pages[cp]&&state.pages[cp].locked)return;
  navigateTo(cp-1);
}

document.getElementById('btn-prev').onclick=prevPage;
document.getElementById('btn-next').onclick=nextPage;

// Touch swipe
document.getElementById('pages-wrap').addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
document.getElementById('pages-wrap').addEventListener('touchend',e=>{
  const dx=touchStartX-e.changedTouches[0].clientX;
  if(Math.abs(dx)>50){dx>0?nextPage():prevPage()}
});

// Keyboard
document.addEventListener('keydown',e=>{
  if(adminMode)return;
  if(e.key==='ArrowLeft')nextPage();
  if(e.key==='ArrowRight')prevPage();
});

// ─── ADMIN ───
document.getElementById('admin-trigger').onclick=()=>{
  if(adminMode){exitAdmin();return;}
  document.getElementById('admin-login').style.display='flex';
  document.getElementById('login-pw').value='';
  document.getElementById('login-err').textContent='';
  setTimeout(()=>document.getElementById('login-pw').focus(),100);
};

document.getElementById('login-btn').onclick=doLogin;
document.getElementById('login-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function doLogin(){
  const pw=document.getElementById('login-pw').value;
  if(pw===ADMIN_PASSWORD){
    document.getElementById('admin-login').style.display='none';
    enterAdmin();
  } else {
    document.getElementById('login-err').textContent='סיסמה שגויה, נסה שוב';
    document.getElementById('login-pw').value='';
  }
}

function enterAdmin(){
  adminMode=true;
  document.getElementById('admin-panel').style.display='flex';
  selectedPageIdx=state.currentPage;
  renderAdminSidebar();
  renderEditor();
}

function exitAdmin(){
  adminMode=false;
  document.getElementById('admin-panel').style.display='none';
  renderViewer();
}

document.getElementById('exit-admin-btn').onclick=exitAdmin;
document.getElementById('save-btn').onclick=()=>{applyPageName();saveState();renderViewer()};

// ─── ADMIN SIDEBAR ───
function renderAdminSidebar(){
  const list=document.getElementById('pages-list');
  list.innerHTML='';
  state.pages.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='page-thumb'+(i===selectedPageIdx?' selected':'');
    el.innerHTML=`<span class="pg-num">${i+1}</span><span class="pg-name">${escHtml(p.name)}</span>${p.locked?'<span class="pg-lock">🔒</span>':''}`;
    el.onclick=()=>{applyPageName();selectedPageIdx=i;renderAdminSidebar();renderEditor()};
    list.appendChild(el);
  });
}

document.getElementById('add-page-btn').onclick=()=>{
  applyPageName();
  const p={id:uid(),name:`עמוד ${state.pages.length+1}`,locked:false,elements:[]};
  state.pages.push(p);
  selectedPageIdx=state.pages.length-1;
  renderAdminSidebar();
  renderEditor();
};

document.getElementById('del-page-btn').onclick=()=>{
  if(state.pages.length<=1){notify('לא ניתן למחוק את הדף האחרון');return;}
  if(!confirm('למחוק את הדף?'))return;
  state.pages.splice(selectedPageIdx,1);
  selectedPageIdx=Math.max(0,selectedPageIdx-1);
  if(state.currentPage>=state.pages.length)state.currentPage=state.pages.length-1;
  renderAdminSidebar();
  renderEditor();
};

// ─── EDITOR ───
function getPage(){return state.pages[selectedPageIdx]}

function applyPageName(){
  const p=getPage();
  if(p)p.name=document.getElementById('page-name-input').value||p.name;
}

function renderEditor(){
  const p=getPage();
  if(!p)return;
  document.getElementById('page-name-input').value=p.name;
  const lockBtn=document.getElementById('toggle-lock-btn');
  lockBtn.textContent=p.locked?'🔓 בטל נעילה':'🔒 נעל דף';
  lockBtn.className='btn-sm'+(p.locked?' active-lock':'');

  const area=document.getElementById('elements-area');
  const empty=document.getElementById('empty-el');
  if(!p.elements.length){
    area.innerHTML='';
    const em=document.createElement('div');
    em.className='empty-state';
    em.innerHTML=`<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg><p>הוסף אלמנטים לדף זה</p>`;
    area.appendChild(em);
  } else {
    area.innerHTML='';
    p.elements.forEach((el,i)=>{
      area.appendChild(buildElItem(el,i));
    });
  }
  renderPreview();
}

document.getElementById('toggle-lock-btn').onclick=()=>{
  const p=getPage();if(!p)return;
  p.locked=!p.locked;
  renderEditor();renderAdminSidebar();
};

// ADD ELEMENTS
const addBtns={
  'add-heading':()=>addEl({id:uid(),type:'heading',value:'כותרת ראשית'}),
  'add-subheading':()=>addEl({id:uid(),type:'subheading',value:'כותרת משנה'}),
  'add-text':()=>addEl({id:uid(),type:'text',value:'טקסט כאן...'}),
  'add-image':()=>addEl({id:uid(),type:'image',src:'',alt:''}),
  'add-audio':()=>addEl({id:uid(),type:'audio',src:'',label:'מוזיקה',autoplay:false}),
};
Object.entries(addBtns).forEach(([id,fn])=>{
  document.getElementById(id).onclick=()=>{fn();renderEditor()};
});

function addEl(el){
  const p=getPage();if(!p)return;
  p.elements.push(el);
}

function buildElItem(el,idx){
  const wrap=document.createElement('div');
  wrap.className='el-item';

  const typeName={heading:'כותרת',subheading:'כותרת משנה',text:'טקסט',subtitle:'תת-כותרת',image:'תמונה',audio:'אודיו'}[el.type]||el.type;

  let inner='';

  if(el.type==='heading'||el.type==='subheading'||el.type==='text'||el.type==='subtitle'){
    const isTA=el.type==='text';
    inner=`<div class="el-row"><label>תוכן</label>${isTA?`<textarea data-field="value" data-id="${el.id}">${escHtml(el.value)}</textarea>`:`<input type="text" data-field="value" data-id="${el.id}" value="${escHtml(el.value)}">`}</div>`;
  } else if(el.type==='image'){
    inner=`<div class="el-row"><label>URL תמונה</label><input type="text" data-field="src" data-id="${el.id}" value="${escHtml(el.src||'')}" placeholder="https://..."></div>
    <div class="el-row"><label>תיאור נגישות</label><input type="text" data-field="alt" data-id="${el.id}" value="${escHtml(el.alt||'')}"></div>
    ${el.src?`<img class="img-preview" src="${el.src}" alt="">`:''}`; 
  } else if(el.type==='audio'){
    inner=`<div class="row2">
      <div class="el-row"><label>כותרת</label><input type="text" data-field="label" data-id="${el.id}" value="${escHtml(el.label||'')}"></div>
      <div class="el-row"><label>הפעלה אוטומטית</label><select data-field="autoplay" data-id="${el.id}"><option value="false" ${!el.autoplay?'selected':''}>לא</option><option value="true" ${el.autoplay?'selected':''}>כן</option></select></div>
    </div>
    <div class="el-row"><label>URL לקובץ MP3</label><input type="text" data-field="src" data-id="${el.id}" value="${escHtml(el.src||'')}" placeholder="https://..."></div>`;
  }

  wrap.innerHTML=`<div class="el-item-header">
    <span class="el-type-badge">${typeName}</span>
    <div class="el-item-actions">
      ${idx>0?`<button class="el-action-btn" data-action="up" data-idx="${idx}">▲</button>`:''}
      ${idx<(getPage().elements.length-1)?`<button class="el-action-btn" data-action="down" data-idx="${idx}">▼</button>`:''}
      <button class="el-action-btn del" data-action="del" data-idx="${idx}">✕</button>
    </div>
  </div>${inner}`;

  // Events
  wrap.querySelectorAll('[data-field]').forEach(inp=>{
    const field=inp.dataset.field;
    const elId=inp.dataset.id;
    inp.addEventListener('input',()=>{
      const target=getPage().elements.find(e=>e.id===elId);
      if(!target)return;
      let val=inp.value;
      if(field==='autoplay')val=val==='true';
      target[field]=val;
      renderPreview();
    });
  });

  wrap.querySelectorAll('[data-action]').forEach(btn=>{
    btn.onclick=()=>{
      const action=btn.dataset.action;
      const i=parseInt(btn.dataset.idx);
      const els=getPage().elements;
      if(action==='del'){els.splice(i,1);renderEditor();}
      else if(action==='up'){[els[i-1],els[i]]=[els[i],els[i-1]];renderEditor();}
      else if(action==='down'){[els[i],els[i+1]]=[els[i+1],els[i]];renderEditor();}
    };
  });

  return wrap;
}

function renderPreview(){
  const pane=document.getElementById('preview-inner');
  const p=getPage();
  pane.innerHTML='';
  if(!p)return;
  p.elements.forEach(e=>{
    const el=buildViewElement(e);
    el.style.cssText='transform:scale(0.85);transform-origin:top center;margin-bottom:-14px';
    pane.appendChild(el);
  });
}

// ─── UTILS ───
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function notify(msg){
  const n=document.getElementById('notif');
  n.textContent=msg;n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'),2000);
}

// ─── BOOTSTRAP ───
loadState();
renderViewer();
</script>
</body>
</html>
