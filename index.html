<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסע יום הולדת ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(to bottom,#ffb6c1 50%,#fff 50%);
overflow:hidden;
}

.topbar{
background:black;
color:white;
padding:8px;
}

.card{
background:rgba(255,255,255,0.95);
margin:15px;
padding:15px;
border-radius:15px;
position:relative;
height:260px;
overflow:hidden;
}

#img{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
max-width:90%;
touch-action:none;
user-select:none;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
background:black;
color:white;
}

.admin{
display:none;
background:white;
padding:10px;
}

.pageList{
max-height:120px;
overflow:auto;
border-top:1px solid #ddd;
}

.pageItem{
padding:6px;
border-bottom:1px solid #eee;
cursor:pointer;
}

input,textarea{
width:90%;
margin:5px;
padding:8px;
}
</style>
</head>

<body>

<div class="topbar">🕒 <span id="clock"></span></div>

<h2 id="title"></h2>

<div class="card">
<p id="text"></p>
<img id="img">
<audio id="audio" autoplay></audio>
</div>

<div>
<button onclick="prev()">➡ קודם</button>
<button onclick="next()">הבא ⬅</button>

<button onclick="toggleLock()">🔓 נעילה</button>
<button onclick="toggleAdmin()">🔐 אדמין</button>
</div>

<div class="admin" id="adminPanel">

<h3>עריכת דף</h3>

<input id="titleInput" placeholder="כותרת">
<textarea id="textInput" placeholder="טקסט"></textarea>

<input id="colorInput" placeholder="צבע רקע">

<label>תמונה</label>
<input type="file" onchange="loadImage(event)">

<label>שיר</label>
<input type="file" onchange="loadAudio(event)">

<button onclick="save()">💾 שמור</button>

<div class="pageList" id="list"></div>

</div>

<script>

let admin = false;
let index = 0;

let pages = JSON.parse(localStorage.getItem("pages")) || [
{
title:"ברוכה הבאה ❤️",
text:"זה רק מתחיל...",
color:"#ffffff",
img:"",
audio:"",
x:0,
y:0,
scale:1,
locked:false
}
];

function saveDB(){
localStorage.setItem("pages",JSON.stringify(pages));
}

/* שעון */
setInterval(()=>{
document.getElementById("clock").innerText=new Date().toLocaleString();
},1000);

/* רינדור */
function render(){

let p = pages[index];

document.body.style.background = p.color;

document.getElementById("title").innerText = p.title;
document.getElementById("text").innerText = p.text;

/* תמונה */
let img = document.getElementById("img");

if(p.img){
img.src = p.img;
img.style.display = "block";
img.style.transform = `translate(-50%,-50%) translate(${p.x||0}px,${p.y||0}px) scale(${p.scale||1})`;
}else{
img.style.display = "none";
}

/* מוזיקה */
let audio = document.getElementById("audio");
if(p.audio){
audio.src = p.audio;
audio.play().catch(()=>{});
}

/* אדמין */
document.getElementById("adminPanel").style.display = admin ? "block" : "none";

if(admin){
titleInput.value = p.title;
textInput.value = p.text;
colorInput.value = p.color;
renderList();
}
}

/* בדיקת נעילה */
function canMove(){
return !pages[index].locked || admin;
}

/* ניווט */
function next(){
if(!canMove()) return alert("דף נעול");
if(index < pages.length-1){
index++;
render();
}
}

function prev(){
if(index > 0){
index--;
render();
}
}

/* נעילה */
function toggleLock(){
pages[index].locked = !pages[index].locked;
saveDB();
render();
}

/* אדמין */
function toggleAdmin(){
let pass = prompt("סיסמה");

if(pass === "1234"){
admin = !admin;
document.getElementById("adminPanel").style.display = admin ? "block" : "none";
render();
}else{
alert("שגיאה בסיסמה");
}
}

/* שמירה */
function save(){
pages[index].title = titleInput.value;
pages[index].text = textInput.value;
pages[index].color = colorInput.value;

saveDB();
render();
}

/* דף חדש */
function addPage(){
pages.push({
title:"חדש",
text:"",
color:"#fff",
img:"",
audio:"",
x:0,
y:0,
scale:1,
locked:false
});
index = pages.length-1;
saveDB();
render();
}

/* תמונה */
function loadImage(e){
let r = new FileReader();
r.onload = ev=>{
pages[index].img = ev.target.result;
saveDB();
render();
};
r.readAsDataURL(e.target.files[0]);
}

/* שיר */
function loadAudio(e){
let r = new FileReader();
r.onload = ev=>{
pages[index].audio = ev.target.result;
saveDB();
render();
};
r.readAsDataURL(e.target.files[0]);
}

/* גרירת תמונה */
let dragging = false;
let startX = 0;
let startY = 0;

const img = document.getElementById("img");

img.addEventListener("pointerdown",(e)=>{
if(!admin) return;
dragging = true;
startX = e.clientX - (pages[index].x||0);
startY = e.clientY - (pages[index].y||0);
});

window.addEventListener("pointermove",(e)=>{
if(!dragging) return;

pages[index].x = e.clientX - startX;
pages[index].y = e.clientY - startY;

render();
});

window.addEventListener("pointerup",()=>dragging=false);

/* זום */
img.addEventListener("wheel",(e)=>{
if(!admin) return;

e.preventDefault();
pages[index].scale = (pages[index].scale||1) + (e.deltaY * -0.001);

render();
});

/* רשימת דפים */
function renderList(){
let list = document.getElementById("list");
list.innerHTML = "";

pages.forEach((p,i)=>{
let d = document.createElement("div");
d.className = "pageItem";
d.innerText = (i+1)+" "+p.title;
d.onclick = ()=>{
index = i;
render();
};
list.appendChild(d);
});
}

render();

</script>

</body>
</html>
