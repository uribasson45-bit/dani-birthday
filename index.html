<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בונה דפי חוויה ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
overflow:hidden;
}

/* VIEWER */
#viewer{
display:block;
text-align:center;
padding:20px;
}

#vTitle{font-size:28px;}
#vText{margin-top:10px;}

.nav button{
padding:10px;
margin:5px;
background:black;
color:white;
border:none;
border-radius:10px;
}

/* EDITOR */
#editor{
display:none;
height:100vh;
}

#canvas{
flex:1;
position:relative;
background:white;
overflow:hidden;
}

.toolbox{
width:220px;
background:#111;
color:white;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

.toolbox button{
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
}

.element{
position:absolute;
cursor:grab;
user-select:none;
}

.textEl{
font-size:20px;
background:transparent;
}

.imgEl{
max-width:200px;
}

audio{
width:200px;
}

/* layout editor */
#editorWrap{
display:flex;
height:100vh;
}
</style>
</head>

<body>

<!-- VIEW MODE -->
<div id="viewer">
<h1 id="vTitle"></h1>
<p id="vText"></p>

<div class="nav">
<button onclick="prev()">➡ קודם</button>
<button onclick="next()">הבא ⬅</button>
<button onclick="enterAdmin()">🔐 אדמין</button>
</div>
</div>

<!-- EDITOR MODE -->
<div id="editor">

<div id="editorWrap">

<div class="toolbox">
<h3>כלים</h3>

<button onclick="addText()">+ טקסט</button>
<button onclick="addImage()">+ תמונה</button>
<button onclick="addAudio()">+ שיר</button>

<hr>

<input type="file" id="imgUpload" style="display:none" onchange="uploadImage(event)">
<input type="file" id="audioUpload" style="display:none" onchange="uploadAudio(event)">

<button onclick="document.getElementById('imgUpload').click()">העלאת תמונה</button>
<button onclick="document.getElementById('audioUpload').click()">העלאת MP3</button>

<hr>

<button onclick="toggleLock()">🔒 נעילה דף</button>
<button onclick="save()">💾 שמור</button>
<button onclick="exitAdmin()">יציאה</button>
</div>

<div id="canvas"></div>

</div>

</div>

<script>

let admin=false;
let index=0;
let selectedType=null;

let pages = JSON.parse(localStorage.getItem("pages")) || [
{
title:"ברוכה הבאה ❤️",
text:"זה דף ראשון",
locked:false,
elements:[]
}
];

function saveDB(){
localStorage.setItem("pages",JSON.stringify(pages));
}

/* ================= VIEW ================= */

function renderViewer(){
let p=pages[index];

document.getElementById("vTitle").innerText=p.title||"";
document.getElementById("vText").innerText=p.text||"";

/* מנעול */
if(p.locked && !admin){
document.getElementById("vText").innerText="⏳ הדף נעול";
}

}

function next(){
if(pages[index].locked && !admin) return alert("דף נעול");
if(index<pages.length-1){index++;renderViewer();}
}

function prev(){
if(index>0){index--;renderViewer();}
}

/* ================= ADMIN ================= */

function enterAdmin(){
let pass=prompt("סיסמה");
if(pass==="1234"){
admin=true;
document.getElementById("viewer").style.display="none";
document.getElementById("editor").style.display="flex";
loadCanvas();
}else alert("שגיאה");
}

function exitAdmin(){
admin=false;
document.getElementById("viewer").style.display="block";
document.getElementById("editor").style.display="none";
renderViewer();
}

/* ================= CANVAS ================= */

function loadCanvas(){
let canvas=document.getElementById("canvas");
canvas.innerHTML="";

let p=pages[index];

p.elements.forEach(el=>{
createElement(el);
});
}

/* אלמנטים */

function addText(){
let el={type:"text",x:50,y:50,text:"טקסט חדש"};
pages[index].elements.push(el);
createElement(el);
}

function addImage(){
let el={type:"img",x:50,y:50,src:""};
pages[index].elements.push(el);
createElement(el);
}

function addAudio(){
let el={type:"audio",x:50,y:50,src:""};
pages[index].elements.push(el);
createElement(el);
}

/* upload */

function uploadImage(e){
let file=e.target.files[0];
let reader=new FileReader();

reader.onload=ev=>{
let el={type:"img",x:80,y:80,src:ev.target.result};
pages[index].elements.push(el);
createElement(el);
};
reader.readAsDataURL(file);
}

function uploadAudio(e){
let file=e.target.files[0];
let reader=new FileReader();

reader.onload=ev=>{
let el={type:"audio",x:80,y:80,src:ev.target.result};
pages[index].elements.push(el);
createElement(el);
};
reader.readAsDataURL(file);
}

/* יצירת אלמנט */

function createElement(el){

let div=document.createElement("div");
div.className="element";
div.style.left=el.x+"px";
div.style.top=el.y+"px";

if(el.type==="text"){
div.classList.add("textEl");
div.innerText=el.text;

div.contentEditable=true;
div.oninput=()=>el.text=div.innerText;
}

if(el.type==="img"){
let img=document.createElement("img");
img.className="imgEl";
img.src=el.src;
div.appendChild(img);
}

if(el.type==="audio"){
let a=document.createElement("audio");
a.controls=true;
a.src=el.src;
div.appendChild(a);
}

/* drag */
let dragging=false,ox=0,oy=0;

div.onpointerdown=(e)=>{
dragging=true;
ox=e.clientX-el.x;
oy=e.clientY-el.y;
};

window.onpointermove=(e)=>{
if(!dragging) return;
el.x=e.clientX-ox;
el.y=e.clientY-oy;
div.style.left=el.x+"px";
div.style.top=el.y+"px";
};

window.onpointerup=()=>dragging=false;

document.getElementById("canvas").appendChild(div);
}

/* ================= SAVE ================= */

function save(){
saveDB();
alert("נשמר");
}

/* ================= LOCK ================= */

function toggleLock(){
pages[index].locked=!pages[index].locked;
saveDB();
alert("נעילה עודכנה");
}

/* init */

renderViewer();

</script>

</body>
</html>
